  <p>各种"跑步神药"、氨基酸混合粉、氮泵、增肌粉、"促睾"产品。<strong>对学生来说全是智商税。</strong>你的钱应该花在鞋、吃饭和睡觉上。</p>
</div></template>
<template data-ch="11" data-title="睡眠与恢复"><h3>睡眠不足的代价是量化的</h3>
<p>睡眠是最被低估的训练变量。<strong>它不是"重要但不紧急"，它是你所有训练能不能兑现的开关。</strong></p>
<div class="tblwrap">
<table>
<caption>表 11-1 · 睡眠不足的代价是量化的</caption>
<thead><tr><th scope="col">状态</th><th scope="col">代价</th></tr></thead>
<tbody>
<tr><td>缺觉 4 晚</td><td><strong>最大摄氧量下降 5–7%</strong>——直接压低你的成绩上限</td></tr>
<tr><td>睡眠 &lt; 6 小时</td><td>深蹲力量下降约 <strong>20%</strong>——力量课等于白练</td></tr>
<tr><td>睡眠 &lt; 5 小时</td><td>青年男性睾酮下降 <strong>10–15%</strong>——影响恢复与力量增长</td></tr>
<tr><td>睡眠 &lt; 7 小时</td><td>运动后上呼吸道感染风险增加 <strong>2–3 倍</strong></td></tr>
<tr><td>睡眠不足</td><td>简单反应时延长 <strong>10–20%</strong>——影响 800m 起跑与弯道技术</td></tr>
<tr><td>睡眠不足</td><td>相同速度下能耗增加 <strong>5–10%</strong>——直接影响你的配速</td></tr>
<tr><td>睡眠不足</td><td>皮质醇比正常高 <strong>37%</strong>——持续升高会分解肌肉蛋白</td></tr>
</tbody>
</table>
</div>
<p><strong>标准是多少：</strong>青少年运动员（13–18 岁）最佳 <strong>9–10 小时</strong>；高强度训练与耐力项目<strong>最低 8 小时</strong>。</p>
  <p><strong class="need">这一节有两个数，别搞混：</strong><br>
  <strong>① 标准 = 9–10 小时（最佳）</strong>——这是文献值，你的课表达不到。<br>
  <strong>② 你的现实目标 = 8 小时 20 分</strong>（22:30 睡 – 06:20 起 = 7 小时 50 分，＋午休 30 分钟）——这是按你的真实作息能挤出来的上限。<br>
  <strong>执行时只看 ②。</strong>达不到 9 小时不是你的失败，但达不到 8 小时 20 分就是。</p>

<div class="callout danger">
  <span class="lbl">你的结构性冲突，必须直说</span>
  <p><strong>按标准你需要 9–10 小时。而你的作息是 21 点下课、23 点前回寝、次日 8 点上课——即使 23:00 入睡、06:20 起床也只有 7 小时 20 分，低于 8 小时的最低线。</strong></p>
  <p><strong>这是这份计划里唯一无法用训练设计解决的问题。</strong>只能靠三条部分缓解：</p>
  <p><strong>① 下课后直接回寝，把入睡时间提前到 22:30。</strong>21:00 下课到 22:30 有 90 分钟，够洗漱、拉伸、加餐——<strong>夜间睡眠能到 7 小时 50 分。</strong><br>
  <strong>② 午休补 20–30 分钟。</strong>13:00–15:00 之间，平躺，别超过 30 分钟（超过会进入深睡眠，醒来更迷糊）。<strong>7 小时 50 分 ＋ 午休 30 分钟 ≈ 8 小时 20 分，达到高强度训练人群的最低线。</strong><br>
  <strong>③ 周末补觉，但别依赖它。</strong>研究结论很明确：周末补觉只能部分恢复运动表现，无法完全弥补睡眠债。<strong>睡眠是必修课，不是可以透支的信用卡。</strong></p>
  <p><strong>还有一条出路：如果你以后把主训从清晨改到下午（16:30–18:00 那个空档），睡眠压力会显著下降——因为不用 06:20 起床。</strong>这是第 07 节把下午列为次选时段的真正理由。</p>
</div>

<h3>晚间恢复流程（目标 22:30 入睡）</h3>
<p><strong>为什么定 22:30：</strong>恢复规则要求<strong>睡前 2–3 小时完成运动</strong>。22:30 入睡 → 跑步必须在 20:00–20:30 前结束。<strong>而你 21:00 才下课——所以晚课结束后不能安排跑步训练。</strong>这也是第 07 节把所有训练放在清晨、下午和周末的原因。</p>

<p><strong>睡眠环境三件事：</strong>温度 16–19℃（宿舍受限，尽力）、光线全黑（遮光帘 + 眼罩）、噪音（耳塞）。<strong>宿舍里你真正能控制的是眼罩、耳塞和睡前少看屏幕。</strong></p>
<p><strong>睡前四条饮食规则：</strong>① 睡前 2–3 小时完成运动；② 睡前可摄入少量蛋白（一勺酪蛋白或牛奶）帮助夜间修复；③ 避免睡前大量碳水（血糖波动影响睡眠）；④ <strong>睡前 4–6 小时限制咖啡因</strong>——这条对你有个实际推论：<strong>如果比赛在上午 8 点，赛前 3–6mg/kg 的咖啡因摄入时间会落到凌晨，所以实际做法是放弃咖啡因赛前补充，或改在赛前 1 小时小剂量用，并提前在训练中测过耐受性。</strong></p>

<p>训练只是"下订单"，恢复才是"收货"。大学生最大的敌人不是练不够，是<strong>熬夜</strong>。</p>

  <p>这一节讲的是<strong>需要睡多久</strong>。如果你要的是<strong>"怎么才能做到"</strong>，核心只有一条：<br>
  <strong class="need">决定你几点睡着的，不是"几点上床"，是"几点起床 ＋ 什么时候见光"。</strong>生物钟靠光照锚定，不靠意志力。</p>
  <p><strong>而你有一个别人没有的优势：早训 06:30 在操场跑步，本身就是一次完美的光照疗法。</strong>别浪费它——<strong>早晨出门别戴墨镜</strong>（阳光要照到眼睛）。</p>

<h3>睡眠的硬性规则</h3>
<ul>
  <li><strong>固定起床时间</strong>（早训日 06:20、质量课日 06:50，两天各有一个固定值），比固定睡觉时间更重要。生物钟靠起床时间锚定。</li>
  <li><strong>睡前一小时放下手机</strong>。至少别刷短视频——这是最容易偷走你两小时睡眠的东西。</li>
  <li><strong>训练后 2 小时内不睡。</strong>质量课刚结束神经还兴奋，直接躺下反而睡不着。</li>
  <li><strong>下午 15:00 后不喝咖啡/浓茶</strong>。咖啡因半衰期 5–6 小时。</li>
  <li><strong>寝室环境</strong>：如果室友吵，买一副耳塞（几块钱）。睡眠质量的边际收益比任何补剂都高。</li>
  <li><strong>早训日必须提前睡。</strong>周一、周二、周五 <strong>06:20 起床，所以 22:30 前必须上床</strong>（早训日是最容易睡不够的一天）；周三质量课后 23:00 前。<strong>做不到 22:30 睡，第二天早上就取消早训</strong>，改到当天傍晚补一次轻松跑——少跑一次不掉成绩，睡不够会。</li>
</ul>

<h3>跑前跑后到底该不该拉伸（循证答案）</h3>

<div class="callout danger">
  <span class="lbl">先给结论 —— 一句话版本</span>
  <p style="font-size:15.5px;line-height:2"><strong>跑前动、跑后静；<br>
  跑前别让任何一块肌肉被拉超过 60 秒；<br>
  跑后别指望它防酸痛；<br>
  <span class="need">跟腱不要静态拉，改离心提踵。</span></strong></p>
</div>

<h4>① 跑前：不要做长时间静态拉伸，但不是"绝对不能拉"</h4>
<p><strong>证据（2024 年系统综述 ＋ 多层荟萃分析）：</strong></p>
<div class="tblwrap">
<table>
<caption>表 11-3 · 跑前：不要做长时间静态拉伸，但不是绝对不能拉</caption>
<thead><tr><th scope="col">条件</th><th class="c" scope="col">对最大力量的影响</th><th class="c" scope="col">是否显著</th></tr></thead>
<tbody>
<tr><td><strong>单次静态拉伸 ≥ 60 秒</strong></td><td class="c">效应量 <strong>–0.84</strong>（大效应）</td><td class="c"><span class="pill p-red">显著</span></td></tr>
<tr><td>单次静态拉伸 &lt; 60 秒</td><td class="c">–0.13</td><td class="c"><span class="pill p-green">不显著</span></td></tr>
<tr><td>总拉伸量 &gt; 480 秒（8 分钟）</td><td class="c">–0.46</td><td class="c"><span class="pill p-amber">显著</span></td></tr>
<tr><td>总拉伸量 ≤ 480 秒</td><td class="c">–0.14</td><td class="c"><span class="pill p-green">不显著</span></td></tr>
</tbody>
</table>
</div>
<p><strong>关键临界值：单次 60 秒。</strong>超过它，力量会明显下降；没超过，影响不显著。</p>
<p><strong class="need">但这里有个反直觉的地方，流行说法漏掉了：</strong>上面测的是<b>孤立最大力量测试</b>（比如腿屈伸、提踵）。对<b>完整运动表现（跑、跳、冲刺）</b>，<b>没有发现显著负面影响</b>——综述作者的原话是：</p>
<p class="quote">"我们的结果<b>不支持</b>此前'在跳跃或冲刺等之前将静态拉伸排除出热身'的建议。"<br>
"<b>严格禁止</b>将拉伸纳入（动态）热身程序，似乎<b>缺乏证据支持</b>。"</p>
<p><strong>所以正确做法不是"跑前禁止拉伸"，而是：</strong><br>
· <strong>以动态动作为主</strong>（摆腿、弓步走、高抬腿、小步跑）——动态拉伸在所有指标上都没有负面影响，部分指标还偏正向；<br>
· <strong>静态拉伸如果要做，每个部位别超过 60 秒</strong>；<br>
· <strong>先慢跑 3–5 分钟把体温升起来</strong>，这比任何拉伸都重要。</p>
<p class="ref">来源：Revisiting the stretch-induced force deficit: A systematic review with multilevel meta-analysis of acute effects. <i>J Sport Health Sci</i>. 2024.（证据确定性：低到中等）</p>

<h4>② 跑后：可以拉，但不要指望它防酸痛或加速恢复</h4>
<p><strong>Cochrane 系统综述（12 项 RCT，含 1 项 2377 人的大样本）：</strong></p>
<div class="tblwrap">
<table>
<caption>表 11-4 · 跑后：可以拉，但不要指望它防酸痛或加速恢复</caption>
<thead><tr><th scope="col">做法</th><th class="c" scope="col">对酸痛的效果（100 分制）</th></tr></thead>
<tbody>
<tr><td>运动前拉伸</td><td class="c">1 天后酸痛减轻 <strong>0.52 分</strong></td></tr>
<tr><td>运动后拉伸</td><td class="c">1 天后酸痛减轻 <strong>1.04 分</strong></td></tr>
<tr><td>前后都拉（大样本）</td><td class="c">一周峰值酸痛减轻 <strong>3.80 分</strong>（统计显著，但极小）</td></tr>
</tbody>
</table>
</div>
<p><strong>作者结论（原话）：</strong>"肌肉拉伸，<b>无论在运动前、运动后还是前后都做，都不会对健康成年人的延迟性肌肉酸痛产生有临床意义的减轻</b>。"</p>
<p><strong class="need">所以：跑后拉伸"可以做"，但它的价值不在防酸痛，而在两件事——</strong><br>
① <strong>增加柔韧性</strong>（长期坚持静态拉伸确实能提高关节活动度，这是有证据的）；<br>
② <strong>主观放松感</strong>（这是真实的，只是不体现在指标上）。<br>
<strong>把它当"放松仪式"，不要当"恢复手段"。</strong></p>
<p class="ref">来源：Herbert RD, de Noronha M, Kamper SJ. Stretching to prevent or reduce muscle soreness after exercise. <i>Cochrane Database Syst Rev</i>. 2022;4:CD004577.</p>

<h4>③ 那"防伤"到底靠什么？—— 不靠拉伸，靠力量</h4>
<p><strong>这是本节最该记住的一条：</strong>多数荟萃分析的结论是——<strong>拉伸对"全因运动损伤"的预防效果不显著</strong>；而<strong>力量训练能把运动损伤减少约三分之一</strong>。</p>
<p><strong>→ 所以你要防伤，应该练第 09 节的力量，不是天天拉筋。</strong>（近期的系统综述提示拉伸可能对<b>肌肉拉伤</b>这一类特定损伤、以及降低<b>肌肉硬度</b>有帮助，但对"全都不受伤"这个目标，证据不足以支持拉伸。）</p>

<div class="callout danger">
  <span class="lbl">⚠️ 对你（跟腱弹响 ＋ 扁平足）的特别修正：跟腱不要静态拉</span>
  <p><strong>小腿三头肌／跟腱的静态拉伸，会增加跟腱的张力</strong>。而跟腱是你身上<b>唯一的活跃信号</b>（偶尔弹响）。所以：</p>
  <p><strong class="need">跑后不要猛拉跟腱和小腿，改成「离心提踵」：</strong><br>
  台阶边缘，双脚踮起 → <strong>单腿用 3 秒慢慢放下</strong>（只做下落这一半）→ 双脚踮起回到起点。3×15/腿，<strong>每天做</strong>。<br>
  离心训练是跟腱康复的<b>金标准</b>，比拉伸有用得多——它既增加跟腱的负荷耐受度，又不制造额外张力。</p>
  <p><strong>其他部位（大腿前后侧、髋、臀部）可以正常做静态拉伸</strong>，每个动作 15–30 秒，<b>拉到"有牵拉感但不疼"就停</b>。</p>
</div>

<div class="callout good">
  <span class="lbl">照这个执行（和你现有的作息表完全兼容）</span>
  <p><strong>跑前 10 分钟（动态为主）：</strong><br>
  ① 慢跑 3–5 分钟（把体温升起来）→ ② 摆腿（前后/左右）、弓步走、高抬腿、小步跑、后踢腿，各 2×30m → ③ 短冲刺 2×60m（只在质量课日做）<br>
  <span class="opt">你手册里早训日的"06:30–06:40 热身（动态拉伸、摆腿、小步跑）必须做够 10 分钟"就是这个，不用改。</span></p>
  <p><strong class="need">早训的热身尤其不能省。</strong>06:30 刚起床时体温低、椎间盘含水量高、神经激活不足，<strong>受伤风险明显高于傍晚</strong>——所以这 10 分钟是你一天里最不能跳过的 10 分钟。</p>
  <p><strong>跑后 10 分钟（静态 ＋ 泡沫轴）：</strong><br>
  ① <strong>离心提踵 3×15/腿</strong>（跟腱，替代静态拉伸）→ ② 大腿前后侧、髋、臀部静态拉伸，每动作 15–30 秒 → ③ 泡沫轴：小腿、大腿、臀部、髂胫束，每部位 30–60 秒<br>
  <span class="opt">目的写清楚：<strong>为了柔韧性和放松，不是为了"防止明天酸痛"</strong>——后者证据不支持。</span></p>
</div>

<h3>夏季（6–8月，35–40℃）</h3>
<ul>

  <li><strong>补水补盐</strong>：训练前 30 分钟喝 300–500ml，训练中每 20 分钟喝几口，超过 60 分钟必须补电解质。</li>
  <li><strong>减量</strong>：夏季跑量比春秋降 10–20%，但保持每周 1 次质量课（改在清晨）。</li>
  <li><strong>中暑预警</strong>：头晕、恶心、停止出汗、皮肤发冷 → 立即停止、阴凉处降温、补水。<strong>这不是"坚持一下"的事，是会出人命的。</strong></li>
</ul>

<h3>冬季（12–2月，5–10℃ 湿冷）</h3>
<ul>
  <li><strong>分层穿法</strong>：内层速干长袖 → 中层抓绒 → 外层防风。跑热了脱外层系腰上。</li>

  <li><strong>跑后立刻换干衣服</strong>。湿冷 + 静止 = 感冒，而且重庆冬天感冒特别难好。</li>
  <li><strong>冬天是堆跑量的黄金期</strong>。别人因为冷减少跑量，你按计划执行，春天就拉开差距了。</li>

  <p><strong>报名前必须核对：</strong>① 当年赛事名录里有没有它；② 规程里有没有写明"可授予等级称号的组别和小项"；③ <strong>你的年龄组别对不对得上</strong>（2025 年规程的少年组是 2008.1.1–2009.12.31 出生，你 2026 年刚满 18 岁，需按当年口径核对）。</p>

<h3>比赛当天流程</h3>
<div class="card tight">
<h4 style="margin-top:0">赛前 2–3 小时</h4>
<p>吃易消化的碳水（面条、米饭、面包），七分饱。不要吃油腻、辣的、没吃过的东西。<strong>比赛日绝对不尝试新食物。</strong></p>
</div>
<div class="card tight">
<h4 style="margin-top:0">赛前 60–45 分钟</h4>
<p>可选：黑咖啡 1 杯（<strong>必须提前在训练中测试过</strong>，别第一次就在比赛用）。</p>
</div>
<div class="card tight">
<h4 style="margin-top:0">赛前 40–25 分钟</h4>
<p><strong>热身</strong>：慢跑 10–12 分钟 → 动态拉伸 5 分钟 → 跑姿练习 → 2–3 次 60–80m 加速跑（跑到接近比赛配速）。<br>
<strong>热身的目的不是累，是"把身体叫醒"。</strong>800m 热身不充分，前 200m 会感觉腿是木的。</p>
</div>
<div class="card tight">
<h4 style="margin-top:0">赛前 10 分钟</h4>
<p>换钉鞋 → 上跑道 → 起跑练习 1–2 次 → 深呼吸，把注意力放在"第一个 200m 的节奏"上，而不是"我好紧张"。</p>
</div>
<div class="card tight">
<h4 style="margin-top:0">赛后 15 分钟内</h4>
<p>慢走 5–10 分钟让心率降下来（<strong>千万别立刻坐下或躺下</strong>，容易头晕甚至晕厥）→ 换干衣服 → 补碳水 + 蛋白（牛奶 + 香蕉）。</p>
</div>

<h3>大二至大四比赛规划</h3>
<ul>
  <li><strong>大二</strong>：主攻重庆市大学生田径比赛（5 月上旬）＋ 全国大学生田径锦标赛（7 月，<strong>见世面为主</strong>）。全年 4–6 场比赛。<span class="opt">（注意：大二的目标是二级，不是一级——一级需要 85–110km/周，那和你的考研规划冲突，见第 17、22 节。）</span></li>
  <li><strong>大三</strong>：增加比赛密度（6–8 场），主项逐步向 1500m/5000m 倾斜。<strong>目标是保持三级、顺带冲二级</strong>——考研启动年，不追一级（见第 17 节）。</li>
  <li><strong>大四</strong>：<strong>9–12 月考研冲刺期只做保底训练</strong>；12 月底考完到毕业前有一段自由期，如果那时有市赛，可以恢复训练冲最后一次。同时开始跑半马，为毕业后转路跑铺路。</li>
</ul></template>
<template data-ch="15" data-title="伤病预防与旧伤管理"><p>很多跑者的伤病都与训练负荷增加过快、恢复不足或动作/场地突然变化有关。<strong>你可以少练一点，但绝不能带伤硬顶。</strong></p>

<div class="callout warn">
  <span class="lbl">关于左脚骨折史：降级为"背景信息"</span>
  <p>你说现在没什么问题了——那就按"没问题"执行，不必先跑医院。但有一条底线请别破：<strong>前 7 周（10.05–11.22）不做跳跃类训练</strong>（跳箱、蛙跳、单腿跳、跳绳双摇）。原因很简单：跳跃类动作对足踝的冲击明显大于跑步，而愈合过的部位对冲击的耐受度没人能保证。11.22 之后若全程无痛，再按第 09 节的四个条件逐步引入。</p>
  <p><strong class="need">"不必先跑医院"是有前提的——不是"永远不用去"。</strong>下面任一条出现，就别再自评，直接去骨科拍<strong>负重位 X 光</strong>（负重位才能看出应力性问题，普通卧位片可能正常）：<br>
  ① <strong>开训后 4 周内左脚/左踝出现任何持续不适</strong>（不是跑完当天酸，是持续存在）；<br>
  ② <strong>疼痛集中在骨头上某一个点、用手指能按到</strong>——这是应力性骨折最典型的信号，和肌肉拉伤的"一片区域酸"完全不同；<br>
  ③ <strong>单脚跳一下会痛，或单腿提踵明显比右脚弱</strong>；<br>
  ④ <strong>夜间痛、或休息时也痛</strong>。<br>
  <span class="opt">应力性骨折发现得越早、停跑时间越短；拖成完全性骨折，停跑可能长达数月甚至需要手术。<strong>这一条的价值超过本手册里所有的配速表。</strong></span></p>
</div>

<div class="callout good">
  <span class="lbl">好消息：你的体育课是「普拉提」，不是篮球</span>
  <p><strong>你的课表显示：大学体育 1-034「普拉提」，周一 1-2 节（08:10–09:50）＋ 周二 7-8 节（16:20–18:00），一周两次。</strong></p>
  <p><strong>这是这份计划里最好的一个意外。</strong>如果体育课是篮球，急停、变向、单脚落地正是你左脚骨折的那类动作，风险会很高；<strong>普拉提没有这些问题。</strong></p>
  <p><strong>普拉提对你是"正收益"，不是"风险"：</strong></p>
  <ul style="margin-left:18px">
    <li><strong>零冲击、无跳跃</strong>——不会像篮球那样给左脚和跟腱叠加落地冲击</li>
    <li><strong>练的正好是你最缺的两块</strong>：核心稳定性（跑步时骨盆不晃、减少膝内扣）和髋踝柔韧（扁平足 + 跟腱弹响最需要的活动度）</li>
    <li><strong>呼吸控制与身体感知</strong>——这两样对 1500m 的节奏感和配速控制有间接帮助</li>
  </ul>
  <p><strong>但有三条要注意：</strong></p>
  <ul style="margin-left:18px">
    <li><strong>① 别做超出能力的动作。</strong>普拉提课上如果有单腿平衡、深屈膝、大幅度踝背屈的动作，<strong>做不到就退阶</strong>，别硬撑。你的跟腱和左脚不需要"证明自己"。</li>
    <li><strong>② 两次体育课会占掉两个窗口</strong>（周一 08:10–09:50、周二 16:20–18:00），但都不影响早训——周一早训 06:30–07:25 在体育课之前，照常执行。</li>
    <li><strong>③ 体育课考勤是硬性的</strong>（成绩构成里"选项课"占 50%），不能为了跑步翘课。反过来，成绩构成里有"<strong>身体素质（课外锻炼）20%</strong>"，对每周跑 5–6 次的你，这 20% 是白送的。</li>
  </ul>
</div>

<div class="callout warn">
  <span class="lbl">备用：万一以后换到对抗性项目</span>
  <p>如果后面学期换到篮球、足球这类项目，记住这三条：<br>
  <strong>① 上课前自己补热身，重点做踝</strong>（踝关节绕环 20 次 + 原地提踵 20 次 + 弹力带外翻 15 次/腿）；<br>
  <strong>② 不抢篮板、不硬起跳、落地必双脚；</strong><br>
  <strong>③ 对抗课当天或次日，跑步降级为轻松跑</strong>，不排质量课——<strong>它不计入你的跑量统计，但会留在你的腿里。</strong></p>
</div>

<div class="callout danger">
  <span class="lbl">现在真正的重点：跟腱会响</span>
  <p>这条信息比骨折史更值得处理——因为它是<strong>你现在身上唯一的活跃信号</strong>。跟腱的特殊之处在于：<strong>它的小问题可以拖很久，但它的大问题（断裂）只需要一次。</strong>跑者跟腱断裂后，手术 + 康复要 6–12 个月，基本等于告别一个赛季。</p>
  <p>好消息是：<strong>"响"大多数情况是良性的</strong>，不需要你停止训练。但你需要知道怎么区分，以及怎么用每天 5 分钟把风险压下去。</p>
</div>

<h3>先分清"响"是哪一种</h3>
<div class="tblwrap">
<table>
<caption>表 15-1 · 先分清响是哪一种</caption>
<thead><tr><th scope="col">表现</th><th scope="col">可能是什么</th><th class="c" scope="col">怎么办</th></tr></thead>
<tbody>
<tr><td>踝外侧响、脚踝转动时有"啪"的弹跳感，<strong>不痛不肿</strong></td><td>腓骨肌腱弹响（以前崴过脚的人常见）</td><td class="c"><span class="pill p-green">观察 + 强化</span></td></tr>
<tr><td>跟腱处活动时有轻微"捻发"感或响声，<strong>不痛不肿</strong></td><td>跟腱周围组织的轻微摩擦</td><td class="c"><span class="pill p-green">观察 + 强化</span></td></tr>
<tr><td>响，<strong>同时有按压痛或晨起僵硬</strong></td><td>跟腱病（tendinopathy）早期</td><td class="c"><span class="pill p-amber">减量 + 离心训练</span></td></tr>
<tr><td>响，<strong>伴肿胀、发热、跟腱变粗</strong></td><td>跟腱炎 / 腱鞘炎</td><td class="c"><span class="pill p-red">就医</span></td></tr>
<tr><td>突然"啪"一声 + <strong>蹬地无力、单腿提踵做不到</strong></td><td>跟腱断裂</td><td class="c"><span class="pill p-red">立刻急诊</span></td></tr>
</tbody>
</table>
</div>
<p><strong>如果是前两种（不痛、不肿、不影响跑），不用管它，但下面这套训练要开始做。如果是后三种，先别跑，去运动医学科。</strong></p>

<div class="callout">
  <span class="lbl">如果左右两只脚"响的方向不一样" —— 这是正常的，而且它是有用的线索</span>
  <p><strong>先说结论：左右不对称是常态，本身不代表有问题。</strong>人体的腿长、足弓高度、肌肉力量、关节活动度左右都有差异——而你有<b>轻微扁平足</b>，扁平足通常左右程度就不同。</p>
  <p><strong>更关键的一点：不同动作方向，牵动的是完全不同的结构。</strong>所以"哪只脚在哪个方向响"，取决于那一侧哪个结构更容易弹。<strong>两只脚响的来源很可能根本不是同一个结构，方向自然就不一样。</strong></p>
  <div class="tblwrap">
  <table>
  <caption>表 15-2 · 弹响定位表：位置 → 涉及结构 → 什么动作响</caption>
  <thead><tr><th class="c" scope="col">响声位置</th><th scope="col">涉及的结构</th><th class="c" scope="col">什么动作时容易响</th></tr></thead>
  <tbody>
  <tr><td class="c"><strong>外踝后方</strong><br><span class="opt">外侧</span></td><td><strong>腓骨长 / 短肌腱</strong>（在腓骨肌支持带下滑动）</td><td class="c">背屈、内翻</td></tr>
  <tr><td class="c"><strong>内踝后方</strong><br><span class="opt">内侧</span></td><td><strong>胫后肌腱</strong>（<strong class="need">和扁平足直接相关</strong>）、趾长屈肌腱</td><td class="c">背屈、外翻、足弓塌陷时</td></tr>
  <tr><td class="c"><strong>脚踝前方</strong></td><td>胫骨前肌腱、趾长伸肌腱，或踝前骨赘</td><td class="c">背屈（向上勾脚）</td></tr>
  <tr><td class="c"><strong>脚踝后方</strong><br><span class="opt">跟腱区</span></td><td>跟腱周围组织、腓肠肌腱、趾长屈肌腱</td><td class="c">跖屈（向下压）</td></tr>
  </tbody>
  </table>
  </div>
  <p><strong class="need">先说清楚这段能做什么、不能做什么：</strong><br>
  下面这套 10 秒自查<strong>只能</strong>帮你记录"响声大概在哪个方位"，<strong>不能</strong>靠它确诊是哪条肌腱、更不能据此判断"良性还是恶性"。肌腱定位和性质判断是医生的事，你的任务是<strong>观察记录 + 及时就医</strong>。</p>
  <p>把手指分别放在 <strong>① 外踝后方 ② 内踝后方 ③ 跟腱上</strong>，然后做那个会响的动作，记下哪个方位感觉最明显——<strong>这个记录是带给医生看的，不是给你自己下诊断的。</strong></p>
  <p><strong class="need">判断标准还是那一条：疼不疼、肿不肿。</strong><br>
  不痛不肿 → <strong>观察 ＋ 强化</strong>（就是下面那套 5 分钟足踝训练）；<br>
  伴痛 / 肿 / 卡住 / 打软腿 → <strong>去运动医学科</strong>，把方位记录带给医生看。</p>
  <p><strong class="need">⚠️ 还有一条：不要反复去"测试"它。</strong>反复压、反复提会持续刺激那个结构，让它从"不痛"变成"痛"。<strong>一天试一次记下来就够了，别当成解闷。</strong></p>
  <p style="color:var(--txt3)"><strong>✅ 2026.9.22 已确认：你的弹响目前「完全不痛不肿」</strong> → 暂按观察处理，<strong>不需要专门治疗，也不用减量</strong>，但如果出现疼痛或肿胀，立即按上面的红旗标准就医。下面两件事继续做。</p>
</div>

<div class="callout good">
  <span class="lbl">不痛不肿的弹响：观察什么、强化什么</span>
  <p><strong>"不痛不肿"意味着什么：</strong>目前没有疼痛、肿胀、无力、不稳或功能异常，因此可以先观察、继续训练；一旦出现以上任何一条，就按上面的红旗标准去运动医学科评估。<strong>不要</strong>试图从响声反推"到底是哪个结构出了问题"——那是医生的工作，你的任务是记录和观察。</p>
  <p><strong>① 强化（每天做，一共 5–8 分钟）</strong><br>
  · <strong>离心提踵</strong> 3×15/腿（3 秒慢下）—— 你已经在做，<strong>继续</strong>；<br>
  · <strong>足内在肌</strong>：毛巾抓握 ＋ 短足练习（脚掌贴地，把大脚趾根部朝脚跟"缩短"足弓，<b class="need">不是蜷脚趾</b>），各 3×15；<br>
  · <strong>单腿闭眼站立</strong> ≥30 秒/腿（本体感觉——也是第 09 节力量第二阶段的入场条件之一）；<br>
  · <strong>臀中肌</strong>：蚌式、侧卧抬腿、弹力带侧走，3×15/侧。<span class="opt">（髋外展无力 → 落地时踝内翻 → 腓骨肌腱被反复牵拉。练髋其实是在保护踝。）</span></p>
  <p><strong>② 观察（记在训练日志的"疼痛/异常"栏，一周看一次）</strong><br>
  <strong class="need">出现下面任何一条，就从"观察"切换到"处理"：</strong><br>
  · 响声<b>变多</b>——原来只在特定角度响，现在随便动都响；<br>
  · 响声<b>变大</b>——从"咔"变成"咯噔一下"；<br>
  · 开始有<b>酸胀</b>，尤其运动后；<br>
  · 出现<b>晨起僵硬</b>；<br>
  · 踝关节有<b>不稳感 / 打软腿</b>；<br>
  · 响声<b>伴随活动度下降</b>（勾脚或绷脚的范围变小）。</p>
  <p><strong>→ 出现任意一条：先减量（砍掉质量课，只留轻松跑），并去运动医学科。</strong><br>
  <strong>→ 一条都没有：照计划跑，不用管它。</strong></p>
  <p style="color:var(--txt3)"><strong>下一个检查点：11 月中（训练第 7 周）。</strong>那时你要复查跟腱和跑量，顺带评估一下这两个弹响有没有变化。</p>
</div>

<h3>每天 5 分钟：跟腱保护训练</h3>
<div class="card">
<p><strong>① 离心提踵（最重要，直接强化跟腱）</strong></p>
<p>站台阶边缘，<strong>双脚</strong>踮起到最高点 → 抬起一只脚，用<strong>单腿</strong>慢慢下放（心里数 3 秒）到脚跟低于台阶 → 再双脚回到踮起位。<code>3 组 × 15 次 / 腿，每天做</code>。</p>
<p style="color:var(--txt3);font-size:12.5px">这是运动医学里证据最充分的跟腱训练（Alfredson 方案的简化版）。坚持 12 周，跟腱的耐受度会有明显提升。</p>
<p style="margin-top:12px"><strong>② 小腿拉伸</strong>：直膝拉腓肠肌 + 屈膝拉比目鱼肌，各 <code>30 秒 × 3</code>。</p>
<p style="margin-top:12px"><strong>③ 热身必须做够</strong>：跟腱在"冷"状态下最脆弱，尤其重庆冬天早上。出门前先做 20 次原地提踵 + 踝关节绕环。</p>
<p style="margin-top:12px"><strong>④ 避免突然加量或加速</strong>：跟腱伤几乎都发生在"跑量或配速突然上去"的那两周。这也是为什么计划里每 4 周要减量一次。</p>
</div>

<div class="callout danger">
  <span class="lbl">出现这三条，立刻停跑</span>
  <p>① <strong>晨起第一步跟腱僵硬或痛</strong>，走几步才缓解（跟腱病最典型的信号）；<br>
  ② 跟腱中段（跟骨上方 2–6cm 处）<strong>按压有明确痛点</strong>；<br>
  ③ <strong>突然"啪"一声 + 蹬地无力</strong>——这可能是跟腱断裂，立刻急诊，别自己走回去。</p>
</div>

<h3>居家自测：单腿提踵测试</h3>
<div class="card">
<p>找一级台阶，单腿站在台阶边缘，脚跟悬空，做完整的提踵（踮到最高点，再慢慢下放到最低点）。<strong>左右腿分别做，记下能完成的最大次数。</strong></p>
<p>判断标准：<strong>如果左脚比右脚少 3 次以上，说明患侧力量不足</strong>，必须先补力量，再谈跑量。<span class="opt">（红线：≥3 次；入场线：≤2 次，见第 09 节第二阶段条件②。2–3 次之间属灰色地带，保守起见按未达标处理。）</span></p>
<p style="color:var(--txt3);font-size:12.5px">补充测试：单腿闭眼站立，比较左右能坚持的秒数。差距超过 30% 也说明问题。</p>
</div>

<h3>六条旧伤管理规则（必须遵守）</h3>
<ol>
  <li><strong>前 7 周（10.05–11.22）不做任何跳跃类训练。</strong>跳箱、蛙跳、单腿跳、跳绳双摇全部推迟，11.22 后确认无问题、且满足第 09 节四个条件再引入。</li>
  <li><strong>跑量增幅按第 05 节档位规则④执行（每周 ≤10%，低于 30km 时允许 +3km 取整跳档）。一旦左脚或跟腱出现任何信号，立刻降到 8% 以内并停在当前跑量。</strong></li>
  <li><strong>优先在塑胶跑道跑，少跑水泥/柏油路。</strong>塑胶跑道的冲击吸收远好于水泥路。路跑只放在周末，且控制比例。</li>
  <li><strong>训练鞋选缓震稍好的</strong>，不要一上来就穿薄底竞速鞋。适应 3 个月后再考虑。</li>
  <li><strong>每天做足部和小腿强化</strong>（见下方，5 分钟）：提踵、抓毛巾、足底按摩球、单腿平衡。</li>
  <li><strong>补钙 + 关注维生素 D，但不要默认长期大剂量补。</strong>重庆日照少是事实，但"日照少"不等于"你一定缺"。<strong>正确做法：先从饮食（牛奶、鸡蛋、深海鱼）和晒太阳入手；如果担心不足，做一次 25-OH-D 血检，再决定要不要补、补多少。</strong>不要仅凭地域和旧骨折史就长期服用高剂量补剂。</li>
</ol>

<div class="card">
<h4 style="margin-top:0">每日 5 分钟足踝强化（必做）</h4>
<ul style="margin-left:18px">
<li><strong>勾脚 / 绷脚 <code>20 次 × 3 组</code></strong>（<strong>每次做到最大幅度</strong>）——<strong>这是恢复踝背屈活动度最直接的动作，对你尤其重要</strong></li>
<li>单腿提踵 <code>3×15/腿</code>（慢上慢下，感受小腿发力）</li>
<li>踮脚静立 <code>3×30 秒</code></li>
<li>脚趾抓毛巾 <code>3×15</code></li>
<li>足底按摩球滚动 <code>每脚 60 秒</code></li>
<li>单腿闭眼站立 <code>3×30 秒/腿</code>（练本体感觉，<strong>防崴脚</strong>）</li>
<li>弹力带踝关节抗阻（四个方向）<code>各 15 次</code></li>
</ul>
</div>

<div class="callout danger">
  <span class="lbl">补充：左踝骨折为什么值得单独管</span>
  <p><strong>先说好消息：</strong>你说自己"跑完 4–5km 脚踝没有不适"——这说明骨性结构已经能承受日常训练的冲击，是回归系统训练最关键的前提。五年前受伤也意味着骨重塑期早已走完，<strong>不存在"骨头还在重建"的顾虑</strong>。<span class="opt">（本手册那个"400m 57–58 秒"是估算值、不是计时成绩，已降级为待验证。）</span></p>
  <p><strong>但踝关节骨折有它特殊的地方——骨头长好只是第一步，常留三个问题，而这三个恰好是 800m 训练里最容易埋雷的地方：</strong></p>
  <ul style="margin-left:18px">
    <li><strong>① 背屈（勾脚）活动度下降</strong> → 落地缓冲变差，冲击向上传到胫骨、膝、髋 → 容易引发<strong>胫骨骨膜炎和膝痛</strong>。<strong>所以"勾脚/绷脚"那个动作不是随便加的，它是专门修这一项的。</strong></li>
    <li><strong>② 外侧韧带松弛</strong> → 跑不平的路面、下台阶、踩到路缘石就容易反复崴脚，越崴越松。<strong>所以单腿闭眼站立（本体感觉）和弹力带抗阻要天天做。</strong></li>
    <li><strong>③ 关节面累积损伤</strong> → 长期大跑量下有创伤性关节炎的远期风险，表现为跑量上来后踝部隐痛、早上起来僵硬。</li>
  </ul>
  <p><strong>三条由此而来的加严措施：</strong>① 跑量增幅<strong>按第 05 节档位规则④执行（≤10%）</strong>；一旦出现信号，降到 <strong>8%</strong> 以内（本节前面已有）；② <strong>路面优先级：塑胶跑道 &gt; 沥青 &gt; 水泥</strong>，绝不长期在水泥地跑长距离，也别贴着路缘石跑；③ <strong>跑鞋要选后跟包裹稳、中底不发塌、前后掌落差 6–10mm 的</strong>，鞋后跟外侧磨平就退役。</p>
  <p><strong>一条建议：</strong>方便时去校医院或永川当地医院骨科复查一次（有条件拍<strong>负重位 X 光</strong>，看关节间隙与对位是否正常），把片子留档，之后每 1–2 年复查。<strong>几十块钱，值。</strong></p>
</div>

<div class="card">
<h4 style="margin-top:0">扁平足专项（你轻微扁平足）</h4>
<p style="margin-bottom:8px"><strong>为什么单独列：</strong>扁平足的人在跑量上升期，最容易出三种伤——<strong>①足底筋膜炎</strong>（晨起第一步足跟刺痛）<strong>②胫后肌腱炎</strong>（内踝后下方痛）<strong>③膝内侧痛</strong>。根因都一样：<strong>跑量涨得比足弓的承受力快。</strong></p>
<p style="margin-bottom:8px"><strong>三条对策：</strong></p>
<ul style="margin-left:18px">
<li><strong>鞋：</strong>内侧不能塌 + 楦头要宽（扁平足通常前掌偏宽）+ <strong>加一双足弓支撑鞋垫</strong>（已进采购清单，约 40 元）。避开中底过软的"踩屎感"鞋。</li>
<li><strong>力量：</strong>上面那套 5 分钟足踝强化里的<strong>脚趾抓毛巾、单腿提踵、单腿闭眼站立</strong>就是针对扁平足的核心动作。再补一个<strong>短足练习</strong>：脚掌贴地，把大脚趾根部朝脚跟方向"缩短"足弓（<span class="need">不是蜷脚趾</span>），保持 5 秒 × 10 次/脚，每天做。</li>
<li><strong>跑量：</strong>你的增幅上限是<strong>第 05 节档位规则④的 10%</strong>；若足底 / 足弓出现信号，降到 8% 以内。这条对扁平足尤其重要，别自己偷偷加。</li>
<li><strong>路面优先级：</strong><strong>塑胶跑道 &gt; 沥青 &gt; 水泥</strong>。绝不长期在水泥地跑长距离，也别贴着路缘石跑（路面不平、坡度单侧，会让扁平足那一侧吃更多力）。</li>
</ul>
<p style="margin-top:8px"><strong>每天自测：</strong>早上起床第一步，足跟或足弓有没有刺痛？<strong>有 → 说明前一天跑量超了，当天降级为轻松跑或直接休息。</strong></p>
<p style="margin-top:8px"><strong class="need">不要买：</strong>几百上千的"定制矫形鞋垫"、宣称"能矫正/治好扁平足"的鞋。<strong>轻微扁平足不需要这些</strong>——40 元的支撑鞋垫 + 足内在肌力量训练就够了。这是本清单里最典型的智商税。</p>
</div>

<div class="callout danger">
  <span class="lbl">必须立刻停跑的四个信号</span>
  <p>① <strong>旧骨折部位出现"点状"按压痛</strong>（一个手指能按到一个明确痛点）；<br>
  ② <strong>夜间痛</strong>——不跑也痛，甚至睡觉被痛醒；<br>
  ③ 跑后疼痛持续超过 24 小时，且第二天没有减轻；<br>
  ④ 出现跛行，或跑起来明显"发不上力"。</p>
  <p><strong>出现任何一条，立刻停跑并就医，不要"再试一次看看"。</strong>应力性骨折拖成完全骨折，代价是 3–6 个月。</p>
</div>

<h3>最常见的四种伤 + 预警信号</h3>

<thead><tr><th scope="col">伤病</th><th scope="col">早期信号</th><th scope="col">处理</th></tr></thead>
<tbody>
<tr><td><strong>胫骨应力综合征</strong>（小腿内侧骨痛）</td><td>跑步开始 5 分钟后小腿内侧隐痛，跑热后减轻</td><td>立即减量 50%，换缓震更好的鞋，检查是否跑量加太快。<strong>持续疼痛要拍片排除应力性骨折</strong></td></tr>

</tbody>
</table>
</div>

<h3>七条铁律（其中第 5 条含 7 个停跑信号）</h3>
<ol>
  <li><strong>每周跑量增幅不超过 10%。</strong>这是最被验证的防伤原则。</li>
  <li><strong>每 4 周减量一周（×0.8，即相对上一加量峰值减 20%）。</strong>不是可选项。</li>
  <li><strong>每次训练必须热身和放松。</strong>省下 10 分钟热身，可能赔上 3 个月伤病。</li>
  <li><strong>疼痛分两种：</strong>"对称的、大面积的、24–48 小时缓解的肌肉酸胀"可以继续；<strong>"一个手指能按到的点状痛、关节或肌腱的刺痛"必须停。</strong></li>
  <li><strong class="need">不用记"几天"——记这七个信号。出现任何一个，当天就停质量课，并去找运动医学 / 骨科 / 康复专业人员评估：</strong><br>
  ① <strong>骨性点状疼痛</strong>（一根手指能按到明确痛点）<br>
  ② <strong>跑步时疼痛逐渐加重</strong>（不是跑热了就缓解）<br>
  ③ <strong>跛行</strong><br>
  ④ <strong>静息痛 / 夜间痛</strong><br>
  ⑤ <strong>肿胀</strong><br>
  ⑥ <strong>跟腱持续晨僵或按压痛</strong><br>
  ⑦ <strong>疼痛已经改变了你的跑姿</strong><br>
  <span style="color:var(--txt3)">"忍 3 天再看看"不是判断标准——上面七条里中了任何一条，就不要再练质量课。</span></li>
  <li><strong>鞋跑到 500–800km 就换。</strong>中底失去回弹的鞋，是隐形杀手。</li>
  <li><strong>感冒发烧绝对不训练。</strong>病毒性心肌炎在中长跑运动员里不是罕见事。</li>
</ol>

<div class="callout danger">
  <span class="lbl">最危险的一件事</span>
  <p>不要因为"想快点达到二级"就偷偷加量。你的目标是<strong>四年的持续进步</strong>，不是三个月的爆发。<strong>一次重伤可能让你错过整个赛季，甚至永久性地影响成绩上限。</strong>这份计划里每一个减量周、每一个轻松跑，都是为了让你能一直练下去。</p>
</div></template>

<h3>怎么自己更新整份计划（不依赖任何人）</h3>
<p>计划不是一次定死的。你会一直在变，所以下面是<strong>自己动手改计划的六条规则</strong>——照着做就行。</p>

<h4>规则一 · 什么时候换配速表</h4>
<p><strong>5km 成绩每进步 30 秒，就往上换一档。</strong>去第 04 节 D 表找到新的一行，把六个配速抄下来贴在水壶上。<br>
<strong>前提：成绩必须是正式计时测出来的</strong>，不是"感觉快了"。用手机秒表在 400m 跑道跑 5000m（12.5 圈），或者参加一次比赛。</p>

<h4>规则二 · 什么时候加跑量</h4>
<p>下面三条<strong>全部满足</strong>，才能按第 05 节的曲线往上加：</p>
<ol>
  <li>上一周<strong>全程无痛</strong>（关节、跟腱、足底都没有异常）</li>
  <li>体感平均分 ≥ 5 分（1–10）</li>
  <li>睡眠没有明显变差</li>
</ol>
<p><strong>任何一条不满足 → 这周不加量，重复上周的量。</strong>宁可原地踏步一周，也别带伤往上冲。</p>

<h4>规则三 · 什么时候减量</h4>
<p>出现下面任何一条，<strong>当周跑量砍 20–30%</strong>：</p>
<ul>
  <li>晨脉比平时高 5 次/分以上，连续两天</li>
  <li>体感平均分连续两周下降</li>
  <li>同一部位疼了 3 天以上（还没到停跑标准，但一直在）</li>
  <li>睡眠变差、食欲下降、情绪莫名烦躁</li>
</ul>

<h4>规则四 · 什么时候停跑</h4>
<p><strong>看第 15 节那四条红线</strong>（旧骨折点状压痛 / 夜间痛 / 疼痛超过 24 小时不减轻 / 跛行）。出现任何一条：停跑、去医院。<strong>不要"再试一次看看"。</strong></p>

<h4>规则五 · 什么时候该换鞋</h4>
<p>跑鞋跑满 <strong>500–800km</strong> 就该换（大约 4–6 个月，看跑量）。判断方法：按压中底，不回弹就是该换了。<strong>你两双轮换，所以按两双的总里程算。</strong></p>

<h4>规则六 · 跑量跟不上的熔断规则</h4>
<p><strong>第 7 周（11 月中旬）熔断检查（仅此前走原版的人做）：你的「加量周」周跑量能稳定完成 30km 吗？</strong>（原版第 05 节第 7 周正好是 30km；第 8 周是减量周 24km，<strong>别看那一周</strong>。默认走保守版的人跳过这一条——你已经在保守版了。）</p>
<p><strong>没到 → 退回保守版</strong>：以后每周只加 5%，上限锁死在 <strong>40km/周</strong>，把这个量维持到大一结束。<br>
<strong>后果要提前知道：</strong>如果长期稳定在约 40km/周，训练资源会比原计划少，1500m 二级目标的实现难度会明显增加；但具体成绩仍取决于专项训练、恢复、比赛发挥和个人适应。<strong>三级和 800m 二级仍然够得着</strong>，而且你会安全得多。</p>
<p><strong>这不是"失败"，这是数据在告诉你该换目标了。</strong>带伤硬追跑量的人，最后连保守版都跑不了。</p>

<h3 id="c19-1">1. 感冒了 / 发烧了怎么办？</h3>
<p><strong>脖子以上</strong>（鼻塞、流鼻涕、轻微喉咙痛）→ 可以跑，但只跑轻松跑，距离减半。<br>
<strong>脖子以下</strong>（咳嗽、发烧、全身酸痛、腹泻）→ 完全停跑，症状消失后 2 天再恢复。<br>
<strong class="need">发烧绝对不跑。</strong>发烧时运动有心肌炎风险，这不是"拼意志"的事。</p>

<h3 id="c19-2">2. 考试周怎么办？</h3>
<p>考试周（1 月、6 月）切到"维持模式"：<strong>只保留轻松跑，砍掉所有质量课，周跑量降到 80%（＝第 05 节的 ×0.8）。</strong>两周降量不会毁掉你的有氧，但两周缺觉会。<strong>考完第一周不要急着补跑量，按 80% 恢复。</strong></p>

<h3 id="c19-3">3. 寒假回家怎么办？</h3>
<p>你是本地人，回家不是问题——<strong>问题是有没有人陪你跑</strong>。三件事：① 固定一条路线、固定时间，形成习惯；② 永川冬天湿冷，防风外套 + 手套必须穿；③ <strong>寒假是冬训的关键期</strong>，很多人寒假一停，春天就白练了。</p>

<h3 id="c19-4">4. 连着下雨怎么办？</h3>
<p>看第 13 节的雨天分级。<strong>小雨照跑；中雨改室内（自行车 / 跑步机 / 核心）；大雨直接休息。</strong><br>
<strong class="need">雷雨天绝对不要在操场跑。</strong>空旷场地 + 金属钉鞋，这是会出人命的。</p>

<h3 id="c19-5">5. 某天状态特别差怎么办？</h3>
<p><strong>先跑 10 分钟再说。</strong>如果 10 分钟后还是腿发木、心率异常高 → 改成轻松跑或直接回去。<strong>不要硬上质量课</strong>——状态差的时候上强度，是最容易受伤的时候。</p>

<h3 id="c19-6">6. 跑完膝盖 / 小腿疼怎么办？</h3>
<p>分三种处理：<br>
<strong>① 肌肉酸痛</strong>（对称、大面积酸、24–48 小时缓解）→ 正常，继续练。<br>
<strong>② 关节或骨头的点状痛</strong>（一个手指能按到明确痛点）→ 停跑观察 3 天，不缓解就去医院。<br>
<strong>③ 跑起来痛、跑完消失</strong> → 减量，别加量。</p>

<h3 id="c19-7">7. 跟腱又开始响 / 痛了怎么办？</h3>
<p>看第 15 节的鉴别表。<strong>只是响、不痛不肿</strong> → 照常练 + 每天离心提踵；<strong>出现晨起僵硬或按压痛</strong> → 当天质量课降级为轻松跑；<strong class="need">突然"啪"一声 + 蹬地无力</strong> → 立刻急诊，这是断裂。</p>

<h3 id="c19-8">8. 朋友约打球（篮球）怎么办？</h3>
<p><strong>赛季里尽量少打。</strong>理由不是篮球不好，是<strong>负荷不可控</strong>——篮球的急停、变向、落地冲击是跑步的好几倍，而你左脚有骨折史。<br>
如果一定要打：① 一周不超过 1 次；② 打球那天不排质量课；③ 第二天跑量减半。<strong>把篮球当"额外冲击负荷"算进总量里。</strong></p>

<h3 id="c19-9">9. 想加练 / 觉得跑太少怎么办？</h3>
<p><strong>不要加。</strong>你的瓶颈是有氧，不是跑量不够——而是跑量还没堆到位你就想加。<strong>很多业余跑者的伤病，都来自额外加量、恢复不足或训练负荷控制失误。</strong>第 05 节的曲线已经是给你的上限。</p>

<h3 id="c19-10">10. 比赛前紧张、睡不好怎么办？</h3>
<p>正常，所有人都有。<strong>偶尔一晚睡眠不佳不一定明显影响成绩</strong>（真正影响你的是赛前一周的整体睡眠）。但连续多晚睡眠不足会影响恢复和表现，所以别把"一晚没事"当成"天天熬夜也没事"。做法：① 赛前一天把装备全部收拾好，减少早上决策；② 赛前 2 小时到场，熟悉环境；③ <strong>热身一定要做足</strong>——紧张时身体更僵，热身是解药。</p>

<h3 id="c19-11">11. 比赛跑崩了怎么办？</h3>
<p><strong>先看是不是配速错了。</strong>1500m 跑崩的常见原因之一是前 400m 冲太快（第 14 节有分段表）。<br>
跑崩不是失败，是数据——<strong>把崩在第几圈、当时体感多少记进日志，下一次就知道该慢多少。</strong></p>

<h3 id="c19-12">12. 停训一段时间后怎么回来？</h3>
<p><strong>按"停多久，用多久回来"的原则。</strong>停 2 周 → 用 2 周恢复；停 1 个月 → 用 1 个月。<strong>回来第一周只跑轻松跑，跑量为原来的一半。</strong>急着补回来，是非常常见的二次受伤诱因。</p>

<h3 id="c19-13">13. 体重掉了 / 涨了怎么办？</h3>
<p><strong>掉体重</strong>（一个月超过 2kg）→ 吃不够，加餐，尤其是碳水和蛋白。<br>
<strong>涨体重</strong> → 冬训期涨 1–2kg 很正常；涨超过 3kg 就查一下零食和夜宵。<br>
<strong class="need">不要为了跑步减重。</strong>你 173/60 已经偏瘦，再减只会掉肌肉和成绩。</p>

<h3 id="c19-14">14. 老师 / 教练让我按他的方法练，冲突怎么办？</h3>
<p><strong>先听他的。</strong>如果他是体育学院的田径老师或校队教练，他的经验比这份手册更贴近你的实际情况。<br>
但问清楚两个问题：<strong>① 这个安排针对哪个阶段？② 我的左脚旧伤和扁平足他知道吗？</strong>把这份手册给他看，让他判断哪里要改。<strong>有教练的时候，教练说了算。</strong></p>

<h3 id="c19-15">15. 想跑半马 / 全马可以吗？</h3>
<p><strong>大一大二不建议跑全马。</strong>以你当前的训练积累（周跑量 40–50km 级），42km 的单次负荷远超身体适应范围，受伤风险高，而且会挤占发展速度基础的关键窗口。<br>
半马可以尝试，但<strong>至少要等 5km 跑进 18:00 之后</strong>，而且只当"训练性比赛"，不专门备赛。</p>

<h3 id="c19-16">16. 如果最后没达标怎么办？</h3>
<p><strong>那就没达标。</strong>但你会得到别的东西：一个能跑 48km/周的身体、一套自己会调整训练的方法、以及 5km 从 21:00 到 17:00 的成绩。<strong>这些不会因为一张证书没拿到就消失。</strong></p>
<p>而且等级线不是只有一条。第 01 节说过你手上有三张门票：1500m、800m、5000m。<strong>一条走不通，换一条。</strong></p>

<div class="callout good">
  <span class="lbl">这一节的小结</span>
  <p>16 个情境里，真正会反复出现的只有四五个：<strong>今天不想跑、疼了、考砸了、时间不够</strong>。其余的你遇到过一两次就有经验了。</p>
  <p><strong>判断标准始终是同一条：</strong>能不能不中断地跑下去。少跑一次不掉成绩，硬撑一次可能停两周。遇到拿不准的情况，先按"保守"处理，第二天再评估。</p>
</div></template>

<h3>20.1 如果你进了田径队（或跟着练）——两份计划怎么合并</h3>
<p><strong>核心原则：有教练的时候，教练说了算。但你手上有三条不能让的底线。</strong></p>
<p><strong>为什么可以合并、而不是二选一：</strong>教练的集体训练通常是<strong>一周 3–4 次</strong>，管的是<strong>质量课</strong>（间歇、节奏、专项）。剩下的<strong>轻松跑里程、长跑、力量</strong>通常没人管，还是你自己的。<strong>所以：把教练的集体训练日，替换掉第 06 节周模板里的质量课，其余照旧。</strong></p>
<p><strong>合并四步：</strong></p>
<ol>
  <li><strong>先跟教练说清你的情况：</strong>左脚骨折史、跟腱弹响、轻微扁平足、当前 5km 约 21:00。<strong class="need">不要隐瞒伤病史</strong>——这直接关系到他给你安排多少负荷。</li>
  <li><strong>以教练的计划为主。</strong>教练能现场看你跑，手册做不到。这份手册是"没有教练时的替代品"，有教练了它就该退到第二位。</li>
  <li><strong>守住三条底线（不能让）：</strong><br>
  <strong>① 跑量增幅不超过每周 10%。</strong>如果教练给的计划跳量（比如一周从 30km 直接上 45km），把你的基础告诉他。<br>
  <strong>② 跳跃类训练前 7 周（10.05–11.22）不做。</strong>左脚骨折史不是闹着玩的，跟教练说明理由。<br>
  <strong>③ 训练不能侵占睡眠。</strong>如果集体训练排在 21:30 之后，或要求你 5:00 起床导致睡不到 7 小时，跟教练商量改时间。</li>
  <li><strong>每周记日志，两周对比一次。</strong>跟着练之后如果体感连续两周变差、或某处开始疼，<strong>先把情况告诉教练</strong>，不要自己硬扛。</li>
</ol>

<h3>20.2 学业高峰 / 考研备考期：长期降量怎么降</h3>
<p><strong>关键区分：这不是"考试周"那种一两周的事，是"两三个月的维持期"。</strong>（考研备考从大三下开始；如果某段时间特别忙，规则和具体月份无关。）</p>
<p><strong>维持模式的三个数字：</strong></p>
<ul>
  <li><strong>跑量降到 60%</strong>（比如从 40km/周 → 24km/周）</li>
  <li><strong>只保留：轻松跑 ＋ 每周 1 次短质量课</strong>（砍掉长跑和第二次质量课）</li>
  <li><strong>每周最少 3 次，每次不少于 5km</strong>——这是底线</li>
</ul>
<div class="callout good">
  <span class="lbl">为什么"降量"有效，而"全停"代价很大</span>
  <p><strong>跑量降到 40–50%，最大摄氧量基本能维持住。</strong>完全停 2 周以上，有氧才开始明显掉。</p>
  <p><strong>所以：宁可每周跑 3 次 × 5km（15km），也不要完全停。</strong>维持期的目标不是进步，是<strong>"忙完之后不用从零开始"</strong>。</p>
  <p><strong>忙完怎么恢复：</strong>按"<strong>停多久用多久回来</strong>"——忙了 2 个月，就用 2 个月慢慢加回去（每周 +5–8%）。<strong class="need">不要一结束就跳回原来的量</strong>，那是非常常见的受伤诱因。</p>
</div>
<p style="font-size:12.5px;color:var(--txt3)"><strong>另外：团员活动、班委工作这类零散的占用，不用专门降量</strong>——把当天的轻松跑挪到早上（06:30–07:25），或者直接把当天的 8km 砍到 5km 就行。<strong>只有连续两三个月的高强度占用（比如雅思冲刺），才需要启动"维持模式"。</strong></p>

<h3>20.3 计划"对不上"怎么办——先分清"落后"还是"断了"</h3>

<thead><tr><th scope="col">情况</th><th scope="col">判断标准</th><th scope="col">怎么办</th></tr></thead>

<tr><td><strong>断了 1–2 周</strong></td><td>完全没跑，1–2 周</td><td><strong>按"停多久用多久回来"</strong>：用同样的周数恢复，第一周跑量为原来的 50–60%</td></tr>
<tr><td><strong>断了 1 个月以上</strong></td><td>完全没跑，超过 4 周</td><td><strong>回到第 06 节模板 A（复跑适应期）</strong>，从 12km/周重新开始，2–3 周后再接回基础期</td></tr>

<div class="callout danger">
  <span class="lbl">最重要的一条心态：计划是"上限"，不是"欠债"</span>
  <p><strong>落后不等于欠账，不需要补回来。</strong>很多人一落后就想"我上周少跑了 10km，这周补上"——<strong class="need">这是非常常见的受伤诱因。</strong></p>
  <p><strong>正确的想法是：</strong>"我这周从 30km 开始，按 5–8% 往上加。" 第 05 节那条曲线是给"一切顺利"画的上限，<strong>你只要保证别一次跳太多，慢几周完全没关系。</strong></p>
  <p><strong>你有一整个四年。慢两周，等于什么都没发生。</strong></p>
</div>

<h3>20.4 寒暑假一个人怎么跑（你说家里没人一起跑）</h3>
<p><strong>没有陪跑的人，靠"结构"而不是"意志力"。</strong>五条具体的：</p>
<ol>
  <li><strong>固定时间 ＋ 固定路线。</strong>比如每天早上 6:30 从家门口出发，跑同一条路线。<strong class="need">不要每天决定"今天去哪跑"</strong>——那个决策过程就是放弃的入口。</li>
  <li><strong>提前一晚把装备放在门口。</strong>鞋、袜子、衣服前一晚摆好。第二天早上不需要做任何决策。</li>
  <li><strong>用"最小版本"骗过自己。</strong>不想跑的时候，告诉自己"只跑 2km 就回来"。<strong>90% 的情况下你跑完 2km 会继续跑。</strong></li>
  <li><strong>在手表上设一个"本周里程目标"</strong>（COROS 支持），看着数字涨是正反馈。</li>
  <li><strong>回家前先查好路线。</strong>永川城区公园 / 河堤步道（第 07 节有路跑路线要求）。<strong>别到了家才想"去哪跑"。</strong></li>
</ol>
<div class="callout warn">
  <span class="lbl">寒假是最容易断的两周，也是最值的两周</span>
  <p><strong>寒假约 1 个月（1 月 25 日 – 2 月 25 日）。</strong>这段时间没有课、没有考试，<strong>是一年里唯一能"只跑步"的窗口</strong>。</p>
  <p><strong>很多人寒假一停，春天就白练了。</strong>反过来，寒假能坚持的人，春季成绩会跳一截——<strong>因为别人在停，你在涨。</strong></p>
  <p><strong>如果家里实在跑不了（下雪 / 太冷），就保住"每周 3 次 × 5km"这个底线。</strong>不求进步，只求不断。</p>
</div></template>

<h3>21.1 急性伤病：扭伤 / 拉伤 / 摔倒 —— PEACE &amp; LOVE</h3>
<p>跑道上最容易发生的三种急性伤：<strong>踝扭伤、小腿拉伤、摔倒擦伤</strong>。目前运动医学更常用 <strong>PEACE &amp; LOVE</strong>（2019）框架——它不强调长时间制动和冰敷，而是<strong>保护 + 尽早合理负荷</strong>。</p>
<div class="tblwrap">
<table>
<caption>表 21-1 · 急性伤病：PEACE（伤后即刻）&amp; LOVE（随后几天）</caption>
<thead><tr><th class="c" scope="col">步骤</th><th scope="col">做什么</th><th class="c" scope="col">做多久</th></tr></thead>
<tbody>
<tr><td class="c"><strong>P</strong>rotect<br>保护</td><td><strong>立刻停跑</strong>，别再试"走两步看看"；必要时用弹性绷带轻压包扎</td><td class="c">1–3 天</td></tr>
<tr><td class="c"><strong>E</strong>levate<br>抬高</td><td>躺着把伤处抬到高于心脏，帮助消肿</td><td class="c">尽可能多</td></tr>
<tr><td class="c"><strong>A</strong>void<br>避免</td><td>避免常规消炎药和过度冰敷（它们可能干扰组织修复的正常炎症过程）</td><td class="c">前 48–72 小时</td></tr>
<tr><td class="c"><strong>C</strong>ompress<br>加压</td><td>弹性绷带包住，<strong>不要包太紧</strong>（脚趾不发麻、不发紫为准）</td><td class="c">前 48–72 小时</td></tr>
<tr><td class="c"><strong>E</strong>ducate<br>了解</td><td>知道"肿胀是修复的一部分"，不过度医疗化；但出现下表红旗仍必须就医</td><td class="c">全程</td></tr>
<tr><td class="c"><strong>L</strong>oad<br>负荷</td><td>疼痛允许下尽早恢复轻负荷（走路、关节活动），<strong>循序渐进</strong>，不完全制动</td><td class="c">48 小时后开始</td></tr>
<tr><td class="c"><strong>O</strong>ptimism<br>心态</td><td>保持积极预期——灾难化想象会延长恢复</td><td class="c">全程</td></tr>

<tr><td class="c"><strong>E</strong>xercise<br>锻炼</td><td>逐步恢复力量、平衡和专项动作，为重返跑步做准备</td><td class="c">按恢复进度</td></tr>
</tbody>
</table>
</div>
<p><strong class="need">前 48 小时不要热敷、不要按摩、不要涂红花油</strong>——那会让出血和肿胀加重。<strong>很多人第一天就热敷，这是错的。</strong>48 小时后才转热敷 + 轻柔活动，帮助恢复。</p>
<div class="callout danger">
  <span class="lbl">必须去医院的四种情况</span>
  <p>① <strong>完全不能承重</strong>（踩下去痛得站不住）；② 关节明显变形；③ <strong>48 小时后肿胀还在加重</strong>；④ 受伤时听到"啪"的一声。</p>
  <p><strong>你尤其要注意左脚踝。</strong>你左脚骨折过——<strong>任何一次左脚踝扭伤，都按"可能比看起来严重"来处理</strong>：先按上面的 PEACE 步骤保护和处理，48 小时不缓解直接去医院拍片。<strong>不要用"我以前崴过没事"来判断这次。</strong></p>

<h3>21.2 中暑：三级识别（永川夏天真的会遇上）</h3>
<p>永川 7–8 月日均最高 <strong>34℃</strong>，夏天跑一定会碰到高温。<strong>中暑分三级，处理完全不同：</strong></p>

<tbody>
<tr><td class="c"><strong>热痉挛</strong><br><span class="opt">最轻</span></td><td>小腿 / 腹部肌肉抽筋，<strong>人清醒</strong></td><td>停下、到阴凉处、<strong>喝含盐的水</strong>（淡盐水或运动饮料），拉伸抽筋的肌肉</td></tr>
<tr><td class="c"><strong>热衰竭</strong></td><td>头晕、恶心、大量出汗、<strong>皮肤湿冷</strong>、心跳快，人还清醒但很虚</td><td><strong>立刻停止</strong>，到阴凉处平躺、<strong>抬高双腿</strong>、解开衣服、冷毛巾敷颈部 / 腋下 / 腹股沟、小口喝含盐水。<strong class="need">15 分钟内没好转 → 去医院</strong></td></tr>

<p><strong>预防比处理重要：</strong>气温 &gt;32℃ 或湿度 &gt;60% 时<strong>主动降强度</strong>；&gt;35℃ 全部转室内；跑前 2 小时喝 300–500ml；跑中每 15–20 分钟喝 100–200ml。</p>
<p><strong class="need">不要只喝白水。</strong>大量出汗后只补白水会稀释血钠，反而更危险。<strong>跑超过 1 小时，要喝含电解质的</strong>（淡盐水 / 运动饮料 / 盐丸）。</p>

<h3>21.3 岔气：三个动作解决</h3>
<p><strong>跑着跑着肋骨下方刺痛</strong>，原因是横膈膜痉挛。三个动作：</p>
<ol>
  <li><strong>放慢速度</strong>（不是停下，停下反而更疼）</li>
  <li><strong>用手按住痛的那一侧</strong>，同时深吸气 → 用力呼气</li>
  <li><strong>改变呼吸节奏</strong>：从"吸 2 步呼 2 步"改成"吸 3 步呼 3 步"，或者边跑边深呼吸 5–6 次</li>
</ol>
<p><strong>如果 2 分钟不缓解</strong>：停下，弯腰用手压住痛处，慢慢深呼吸到不疼为止。<br><strong>预防</strong>：跑前 1–2 小时别吃太多；热身做够。</p>

<h3>21.5 感冒药和运动：一条容易踩的坑</h3>
<p><strong>很多复方感冒药含伪麻黄碱，会让心率和血压升高。</strong>吃了它去训练，心率会异常高，你会误判自己的强度。<strong>更重要的是：伪麻黄碱属于赛内兴奋剂管控物质</strong>（世界反兴奋剂机构设尿浓度阈值，超标即违规）——你的目标是等级赛，赛前用药必须查清单、留好处方和说明书。</p>
<ul>
  <li><strong>吃了含伪麻黄碱的感冒药 → 当天不跑</strong>（或只慢走）</li>
  <li><strong>脖子以上感冒</strong>（鼻塞、流涕、轻喉咙痛）→ 可以跑，但只跑轻松跑、距离减半，<strong>且不要吃药跑</strong></li>
  <li><strong>脖子以下感冒</strong>（咳嗽、发烧、全身酸痛）→ 完全停跑</li>
  <li><strong class="need">发烧绝对不跑</strong>——有心肌炎风险，这不是拼意志力的事</li>
</ul>

<h3>21.6 最难的那个：不想练了</h3>
<p><strong>这一条可能比前面五条都重要。</strong>四年计划里，你会至少遇到三次"我不想跑了"。<strong>这很正常，不是你的问题。</strong>三种情况，处理方式不同：</p>

<div class="callout warn">
  <span class="lbl">情况一 · 某一天不想跑</span>
  <p><strong>用"最小版本"骗过自己：换鞋出门，只跑 2km。</strong>90% 的情况下你会继续跑；就算只跑 2km 就回来，也比不跑强。</p>
  <p><strong>或者直接改成休息。</strong>一天的缺失，在四年里等于零。</p>
</div>

<div class="callout warn">
  <span class="lbl">情况二 · 连着两三周提不起劲</span>
  <p><strong>这通常是过度训练的信号，不是意志力问题。</strong>检查三件事：① 睡眠够不够；② 跑量是不是涨太快；③ 有没有一直没好的小伤。</p>
  <p><strong>处理：主动减量 30%，两周后再看。</strong>如果减量之后想跑的感觉回来了，说明就是累的——<strong>该休息，不该硬撑。</strong></p>
</div>

<div class="callout warn">
  <span class="lbl">情况三 · 练了几个月，成绩没动</span>
  <p><strong>先确认一件事：你有没有真的按计划跑。</strong>大部分人"练了几个月没进步"，实际是漏了 1/3 的课、而且轻松跑全部跑太快。</p>
  <p><strong>如果确实执行到位还没动</strong>，那是<strong>平台期</strong>，正常。检查：① <strong>5km 复测了吗</strong>（凭感觉判断进步不可靠）；② 最近 4 周有没有减量周；③ 睡眠和饮食有没有变化。</p>
  <p><strong>平台期最好的解法不是加量，是"减量两周 ＋ 换一次刺激"</strong>——比如把节奏跑换成 600m 重复跑。</p>
</div>

<h3>21.7 牙痛 / 看牙医：什么时候能练，什么时候不能</h3>

<div class="callout danger">
  <span class="lbl">先分清是"龋齿"还是"牙髓炎"——这决定了你要停几天</span>
  <p><strong>① 只有吃冷、热、甜的东西才疼，刺激一去掉就不疼 → 多半是浅/中度龋（普通蛀牙）。</strong><br>
  处理：补一次牙就完事。<strong>对训练基本没影响。</strong></p>
  <p><strong>② 不吃东西也疼、晚上躺下更疼、疼得睡不着、冷热刺激后疼很久 → 大概率是牙髓炎。</strong><br>

<div class="callout">
  <span class="lbl">"重点高数"是什么意思 —— 以及你这个专业要特别注意的一个坑</span>
  <p><strong>那句话的意思很简单："把高等数学当成重点科目来抓"。</strong>它说的是<strong>考研数学</strong>的备考重点，<strong>不是让你现在去学高数</strong>。</p>
  <p><strong>为什么高数算"重点"：</strong>考研数学满分 150 分。以数学三（应用统计考的就是它）为例，官方大纲的内容结构是——<strong>微积分（高等数学）约 60%、线性代数约 20%、概率论与数理统计约 20%</strong>（有些机构按真题统计成 56% / 22% / 22%，差别不大）。<strong>高数是分值最大的一块，所以叫"重点"。</strong></p>
  <p><strong class="need">⚠️ 但这句话藏着一个坑，而且正好是给你这种数学专业的学生挖的：</strong><br>
  <strong>你学的是「数学分析」，考研数学三考的是「高等数学（微积分）」——这不是同一门课。</strong><br>
  · <strong>数学分析</strong>：重证明、ε-δ 语言、实数完备性 —— <strong>深</strong><br>
  · <strong>高等数学（数学三）</strong>：重计算、题型固定、套路化 —— <strong>广、快</strong><br>
  <strong>所以你的风险不是"不会"，而是"手生"</strong>：证明题做得溜，但计算速度慢、步骤跳、容易算错。<strong>很多数学专业的学生考数学三，栽的就是这个。</strong><br>
  <strong>→ "重点高数"对你的正确解读是：重点练"计算熟练度和做题速度"，不是"再学一遍理论"。</strong></p>
  <p><strong>还有一层：这句话对不对，取决于你考哪个专业——</strong><br>
  · <strong>应用统计（025200）</strong> → 考 <strong>303 数学三</strong>：高数约 60% ＋ 线代约 20% ＋ 概率约 20%<br>
  · <strong>电子信息（0854）</strong> → <strong>各校不同</strong>，可能是 301 数学一 或 302 数学二（数学二不考概率论）——<strong>必须去研招网查目标院校的招生专业目录</strong><br>
  · <strong>数学（0701 学硕）</strong> → 多数是<strong>自命题"数学分析 ＋ 高等代数"</strong>，<strong>根本没有"高数"这一科</strong><br>
  <strong>→ 所以顺序是：先定专业，才知道该"重点"什么。现在不用急。</strong></p>
  <p><strong>那你现在该做什么：什么都不用专门做。</strong>你正在学的数学分析、高等代数、概率论，<strong>就是最好的考研准备</strong>。把这三门考出高分，一石三鸟：绩点、国励（6000 元）、考研底子。<strong>真正要"练计算"的时间点是大三下（2029.3）。</strong></p>
  <p style="color:var(--txt3)"><strong>记一个以后问高老师的问题：</strong>"老师，我是数学专业的，数学三的高数部分对我来说是'复习'还是'补计算'？该怎么练？"</p>
</div>

<div class="callout warn">
  <span class="lbl">"高老师"这条资源线：请按田径老师那套规则用</span>
  <p>长辈说"高老师在带研究生，他给你指导"，而且"你妈妈他们估计认得到高老师"。<strong>这是你手里的第二张"熟人牌"，和上次那位田径老师完全同构——有认识的人 ≠ 已经帮你。</strong></p>
  <p><strong class="need">所以现在（大一）不要去找他问考研的事。</strong>两个理由：① 太早，考研是大三下的事，现在问了也记不住你；② 一上来就问"怎么考"，会显得你只想走关系。</p>
  <p><strong>正确顺序：</strong><br>
  <strong>① 大一、大二：</strong>把数学基础课（数分 / 高代 / 概率论）考出高分——<strong>让成绩单替你说话，这比任何引荐都管用</strong>。<br>
  <strong>② 大三上（2028.9）：</strong>再通过长辈引荐，带着成绩单去问方向、问专业课复习重点。那时候他才会认真给建议。<br>
  <strong>③ 大三下（2029.3）：</strong>正式备考时问具体的——"老师，XX 学校 XX 专业的自命题专业课，重点考哪几块？"</p>
</div>

<div class="callout danger">
  <span class="lbl">⚠️ 两条要当场问清楚：多邻国、以及"先暂定"这三个字</span>
  <p><strong>① "多邻国"对国内考研完全用不上。</strong>考研英语是全国统考（英语一 / 英语二），和雅思 / 多邻国是两套完全不同的体系——考多邻国不会让你的考研英语多考一分。<br>
  多邻国只有一种情况有用：<strong>你还保留"出国"这个选项</strong>（你们是中外合办，外方 UNCW 可能认多邻国）。但你已经确认不出国。<br>
  <strong>所以直接问一句：</strong>"多邻国是为出国准备的吗？如果我只考国内研，还需要考吗？"<strong>如果答案是"不需要"，这一项就从清单里划掉</strong>，把时间全给四六级和考研英语。</p>
  <p><strong>② 长辈原话是"先暂定重庆科技大学的应用统计"——"先暂定"这三个字很重要。</strong><br>
  <strong>大一定方向、大二验证、大三定校。</strong>现在定死一个学校，两年半后你的成绩、兴趣、就业形势都可能变了。<br>
  大一你只需要锁定一件事：<strong>方向 = 统计 / 数据 / AI 这一类</strong>，然后把数学和英语打好底。<strong>学校到时候再选，而且那时候你会有更多信息。</strong></p>
</div>

<h3>22.5 你问的三个生活场景（以及几个你没问的）</h3>

<div class="callout">

  <strong>每天 30–40 分钟慢跑就够</strong>，不算训练，算活动。<br>
  <strong>实在不方便就当成一个休息周</strong>，回来按"停多久用多久回来"（第 20 节 20.3）。<br>

<div class="callout">

<div class="callout warn">

  · <strong>不要因为约会连续挪训练。</strong>挪一次可以，挪三次就断了<br>

function buildChToc(chHtml, chN){

    var id="ch"+chN+"-s"+(idx++);

  });

function go(v,restoreY){
  if(typeof v!=="number"||isNaN(v))return;   /* v16.11 P1:data-go 非法时不崩溃 */
  if(v < -1) v = -1; if(v >= CH.length) v = CH.length - 1;
  markRead(v);   /* V18:记录已读章节（项目08） */
  if(transitioning){ pendingNav={v:v,y:restoreY||null}; return; }  // v16:不再丢弃连击；过渡中点回原章也排队
  if(v===cur&&restoreY==null) return;
  var stage=$("#stage");
  var _fi=stage.contains(document.activeElement);   /* 2026-10-23:焦点在正文内（被点的翻页按钮将销毁）时，换章后移回正文 */
  transitioning=true;
  stage.classList.add("out");
  setTimeout(function(){
    try{
      cur=v; render(v,restoreY);
      if(_fi){ try{ stage.focus({preventScroll:true}); }catch(_fe){ try{ stage.focus(); }catch(__fe){} } }   /* 2026-10-23:焦点移入正文；播报由 sync() 写 srLive */
      stage.classList.remove("out");
      stage.classList.add("enter");
      void stage.offsetWidth;
      stage.classList.remove("enter");
      if(!restoring) savePos();   // v16.1:恢复期间不存，避免 y=0 覆盖
    }finally{
      try{ sync(); }catch(_se){} /* 2026-10-13:P1-1，render抛错也要同步导航 */
      transitioning=false;   // v16.5 B8:render 抛错也不卡死导航
      stage.classList.remove("out","enter");   /* v16.11 P3:抛错时过渡类不残留 */
    }
    if(pendingNav){ var p=pendingNav; pendingNav=null; go(p.v,p.y); }  // v16:执行最后一次意图
  }, RM?0:320);
}

function _mixRgb(varName){ /* 2026-10-24:只取基色三联值（"r,g,b"），供批量场景循环外取一次；取不到返回 null */
  try{ var v=getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    var m=v.match(/^#([0-9a-f]{6})$/i);
    if(m){ var n=parseInt(m[1],16); return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255); }
    var m2=v.match(/^rgba?\(([^)]+)\)$/);
    if(m2){ var q=m2[1].split(','); return q[0].trim()+','+q[1].trim()+','+q[2].trim(); }
  }catch(e){}
  return null;
}
function _mixRgba(varName,pct){ /* 2026-10-23:color-mix 的等价 rgba——旧内核不支持 color-mix 时热力图/跑道仍可渲染 */
  var rgb=_mixRgb(varName);
  return rgb===null?'transparent':'rgba('+rgb+','+(pct/100)+')';
}
/* ============ 封面：400m 跑道 + 跑量轨迹 + 跑者点 ============ */
function buildTrack(){
  var box=$("#cvTrack"); if(!box) return;
  var W=1000,H=560,CX=500,CY=280,RX=400,RY=230;
  var VBW=1000;   /* v16.14:viewBox 宽度常量（原硬编码 900） */
  function rad(a){return a*Math.PI/180;}
  function pt(rx,ry,a){return [CX+rx*Math.cos(rad(a)), CY+ry*Math.sin(rad(a))];}
  // 跑道线（3 条道）
  var lanes="";
  /* v16.13:跑道线用 CSS 变量，主题切换时自动跟随（原 matchMedia 一次性判断不响应切换） */
  [0,14,28].forEach(function(o){
    lanes+='<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+(RX-o)+'" ry="'+(RY-o*0.575)+'" fill="none" style="stroke:'+_mixRgba('--ink',(o===0?16:9))+'" stroke-width="1"/>';
  });
  // 跑量丝带（48 段，统一灰 + 当前周青 + 减量周淡灰）
  var N=48, band="";
  for(var i=0;i<N;i++){
    var a1=-90+i*(360/N), a2=-90+(i+1)*(360/N), km=KM[i], ph=phaseOf(i+1).c;
    var off=((54-km)/54)*58+10;
    var rx1=RX-off, ry1=RY-off*0.575;
    var rx2=RX-70, ry2=RY-70*0.575;
    var O1=pt(rx1,ry1,a1), O2=pt(rx1,ry1,a2), I1=pt(rx2,ry2,a2), I2=pt(rx2,ry2,a1);
    var _bandOp=(document.documentElement.getAttribute('data-scheme')==='light')?.42:.26; /* 2026-10-23:浅色主题加深丝带，防 1.6:1 糊成一片 */
    band+='<path d="M'+O1[0].toFixed(1)+','+O1[1].toFixed(1)+
      ' A'+rx1.toFixed(1)+','+ry1.toFixed(1)+' 0 0 1 '+O2[0].toFixed(1)+','+O2[1].toFixed(1)+
      ' L'+I1[0].toFixed(1)+','+I1[1].toFixed(1)+
      ' A'+rx2.toFixed(1)+','+ry2.toFixed(1)+' 0 0 0 '+I2[0].toFixed(1)+','+I2[1].toFixed(1)+
      ' Z" fill="'+ph+'" fill-opacity="'+_bandOp+'"/>';
  }
  // 轨迹描边（外轮廓）
  var contour="M";
  for(var k=0;k<=N;k++){
    var a=-90+k*(360/N), km=KM[k%N], off=((54-km)/54)*58+10;
    var p=pt(RX-off,(RY-off*0.575),a);
    contour+=p[0].toFixed(1)+","+p[1].toFixed(1)+(k<N?" L ":" Z");
  }
  // 起跑线刻度（每 4 周）
  var ticks="";
  for(var w=0;w<N;w+=4){
    var aa=-90+w*(360/N);
    var p1=pt(RX-6,RY-3.5,aa), p2=pt(RX-20,RY-11.5,aa);
    ticks+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="var(--line2)" stroke-width="1.2"/>';
  }
  // 当前周标记（v16.11 P2:用 planWeek() 实时计算，不再用加载时快照 CURWK）
  var _pw=planWeek(), _cw=(_pw.days>=0&&_pw.w<=48)?_pw.w:(_pw.days<0?0:49);
  var mi=_cw>0&&_cw<=48?_cw-1:(_cw===49?47:0), aa0=-90+mi*(360/N); /* 2026-10-13:D2，跑完48周时标记停在第48周 */
  var km0=KM[mi], off0=((54-km0)/54)*58+10;
  var pm=pt(RX-off0,(RY-off0*0.575),aa0);
  var curLine='<line x1="'+pm[0].toFixed(1)+'" y1="'+pm[1].toFixed(1)+'" x2="'+pt(RX-80,RY-46,aa0)[0].toFixed(1)+'" y2="'+pt(RX-80,RY-46,aa0)[1].toFixed(1)+'" stroke="var(--ac)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>'+
    '<circle cx="'+pm[0].toFixed(1)+'" cy="'+pm[1].toFixed(1)+'" r="5" fill="var(--ac)"/>'+
    '<text x="'+Math.min(pm[0]+12,VBW-100).toFixed(1)+'" y="'+Math.max(pm[1]-8,20)+'" fill="var(--ac)" font-family="var(--mono)" font-size="12" letter-spacing=".04em">'+
    (_cw>0&&_cw<=48?("第 "+_cw+" 周 · "+km0+"km"):(_cw===0?"10.05 起步 · 12km":"大一已结束"))+'</text>';
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="400 米跑道上的大一跑量轨迹">'+
    '<ellipse id="lanePath" cx="'+CX+'" cy="'+CY+'" rx="'+RX+'" ry="'+RY+'" fill="none" stroke="none"/>'+
    lanes+band+'<path d="'+contour+'" fill="none" stroke="var(--ac)" stroke-width="2.6" stroke-linejoin="round" opacity="1" style="filter:drop-shadow(0 0 7px '+_mixRgba('--ac',55)+')"/>'+
    ticks+curLine+'</svg>';
  // 跑者点沿跑道循环
  var path=$("#lanePath");
  try{
    var total; try{ total=path.getTotalLength(); }catch(_){ total=2*Math.PI*Math.sqrt((RX*RX+RY*RY)/2); } /* 2026-10-04 P2-8:椭圆近似更准 */
    var dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("r","6"); dot.setAttribute("fill","var(--ac)");
    dot.style.filter="drop-shadow(0 0 8px var(--ac))";
    box.querySelector("svg").appendChild(dot);
    if(!RM){
      var t0=null;
      function loop(ts){
        // 元素已脱离文档（切章后 .cv-track 被销毁）时立即终止，避免对游离元素持续取点
        if(!box.isConnected||!path.isConnected){ trackRaf=null; return; }   /* 2026-10-24:取点的是 path，守卫须查 path 本身——切回标签页重建跑道后旧 path 游离、box 仍连接，只查 box 会放行并在游离元素上取点抛 InvalidStateError */
        if(t0===null)t0=ts;
        var f=((ts-t0)%9000)/9000;
        var p=path.getPointAtLength(total*f);
        dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y);
        trackRaf=requestAnimationFrame(loop);
      }
      trackRaf=requestAnimationFrame(loop);
    } else { var p0=path.getPointAtLength(0); dot.setAttribute("cx",p0.x); dot.setAttribute("cy",p0.y); }
  }catch(e){ console.warn("[buildTrack] runner dot init failed", e); }
}

      d2.setDate(d2.getDate()-1);

    if(sleepVals.length>=3&&avgSleep<6) reasons.push('平均睡眠不足6小时（'+avgSleep.toFixed(1)+'h）');

    if(reasons.length>0){

    }

    var noPain=recent.every(function(r){return !hasInj(r);});

/* V18: 时间字符串转秒（支持 mm:ss / h:mm:ss），非法返回 NaN */
function v18toSec(s){
  if(!s) return NaN;
  s = String(s).trim().replace(/[：∶]/g,':').replace(/[．。]/g,'.');
  if(!/^[0-9:.\s]+$/.test(s)) return NaN; /* 2026-10-13:严格字符集，"4:30abc"类尾部垃圾直接拒 */
  var parts = s.split(':');
  if(parts.length<1||parts.length>3) return NaN; /* 2026-10-13:"1:2:3:4"类超段输入直接拒 */
  for(var _vi=0;_vi<parts.length;_vi++){ if(!/^\s*\d+(\.\d+)?\s*$/.test(parts[_vi])) return NaN; } /* 2026-10-13:逐段严格数字，替代parseFloat截断语义 */
  if(parts.length===2){
    var m = parseFloat(parts[0]), sec = parseFloat(parts[1]);
    if(isNaN(m)||isNaN(sec)||m<0||sec<0||sec>=60) return NaN;
    return Math.round(m*60+sec);
  }
  if(parts.length===3){
    var h = parseFloat(parts[0]), mm = parseFloat(parts[1]), ss = parseFloat(parts[2]);
    if(isNaN(h)||isNaN(mm)||isNaN(ss)||h<0||mm<0||mm>=60||ss<0||ss>=60) return NaN;
    return Math.round(h*3600+mm*60+ss);
  }
  var only = parseFloat(s);
  if(!isNaN(only)&&only>0) return Math.round(only); /* 2026-10-04:纯数字=秒，与t2s一致 */
  return NaN;
}

function v18toStr(sec){

}

function v18calcForward(){

function v18fmtTime(sec){ try{ sec=Math.round(sec); var m=Math.floor(sec/60), s=sec%60; return m+':'+('0'+s).slice(-2); }catch(e){ return sec; } } /* 2026-10-15:秒数转mm:ss显示 */
