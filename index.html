  :root:not([data-theme]) .grain::after{background-image:repeating-linear-gradient(5deg,rgba(23,25,29,.02) 0 1px,transparent 1px 7px)}
}

/* 顶部「跑道分道线」进度条：主线 + 略低虚线 */
.prog{position:fixed;top:env(safe-area-inset-top);left:0;width:100%;height:10px;z-index:9997;pointer-events:none} /* 2026-10-25:跟随顶部安全区，iOS 全屏模式下不再被状态栏盖住 */
.prog::before{content:"";position:absolute;top:0;left:0;height:1px;width:100%;background:var(--line2);opacity:.4}
.prog i{position:absolute;top:0;left:0;height:2px;width:0;
  background:var(--ac)}   /* v16:进度条 2px，去辉光 */
/* v16.8:删掉全宽虚线 ::after，它盖住了真实进度 .pdash，留 .pdash 即可 */
.prog .pdash{position:absolute;top:5px;left:0;height:1px;width:0;
  background-image:repeating-linear-gradient(90deg,var(--ac) 0 4px,transparent 4px 9px);opacity:.75}

/* ---------- 顶栏 ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:900;display:flex;align-items:center;gap:var(--sp-4);
  padding-top:env(safe-area-inset-top);padding-bottom:0;padding-left:max(var(--gut),env(safe-area-inset-left));padding-right:max(var(--gut),env(safe-area-inset-right));background:var(--bg);background:color-mix(in srgb,var(--bg) 74%,transparent); /* 2026-10-13:safe-area并入主样式；2026-10-25:顶部安全区，iOS 全屏模式状态栏不再盖住顶栏 */
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid transparent;transition:border-color .4s}
.topbar.stuck{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:var(--sp-3);font-weight:600;font-size:var(--fs-4);
  letter-spacing:-.01em;color:var(--title);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}   /* v16.12:320px 兜底 */
.brand i{width:8px;height:8px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 0 4px var(--ac-dim),var(--glow);flex:none}
.brand em{font-style:normal;font-family:var(--mono);font-size:var(--fs-1);color:var(--ink3);letter-spacing:.1em;font-weight:400}
.crumb{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);font-family:var(--mono);
  font-size:var(--fs-2);color:var(--ink3);letter-spacing:.08em;min-width:0}
.crumb b{color:var(--ac);font-weight:600}
.crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{display:flex;align-items:center;gap:var(--sp-2);font-family:var(--mono);font-size:var(--fs-2);
  color:var(--ink3);border:1px solid var(--line);border-radius:var(--r-2);padding:7px 12px;margin-left:auto;
  background:var(--paper);transition:all .35s var(--ease);box-shadow:var(--sh1);white-space:nowrap;flex:0 0 auto}
.sbtn:hover{color:var(--ink);border-color:var(--line2)}
.tbtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);
  border-radius:var(--r-2);background:var(--paper);font-size:16px;transition:all .35s var(--ease)}   /* v16.13:主题切换 */
.tbtn:hover{border-color:var(--line2);transform:translateY(-1px)}
.sbtn kbd{font-family:var(--mono);font-size:var(--fs-1);border:1px solid var(--line2);
  border-radius:var(--r-1);padding:1px 5px;color:var(--ink4)}
.railbtn{display:none;font-family:var(--mono);font-size:var(--fs-2);border:1px solid var(--line);   /* v16.12:去掉 margin-left:auto，避免与 .sbtn 平分空间 */
  border-radius:var(--r-2);padding:7px 12px;background:var(--paper);transition:all .35s var(--ease)}
.railbtn:hover{color:var(--ink);border-color:var(--line2)}
@media(max-width:999px){.crumb{display:none}.railbtn{display:block}}
@media(max-width:640px){.brand em{display:none}}   /* v16.11 P1:360-390px 顶栏不溢出，版本号缩写隐藏 */
@media(max-width:1080px){.sbtn kbd{display:none}}

/* ---------- 布局 ---------- */
.app{display:grid;grid-template-columns:1fr;max-width:1340px;margin:0 auto;padding-top:0;padding-bottom:0;padding-left:max(var(--gut),env(safe-area-inset-left));padding-right:max(var(--gut),env(safe-area-inset-right))} /* 2026-10-13:safe-area并入主样式，L64的.app部分原被此覆盖 */
@media(min-width:1000px){.app{grid-template-columns:var(--rail) minmax(0,1fr);gap:clamp(22px,3.6vw,52px)}}
.rail{display:none}
@media(min-width:1000px){
  .rail{display:block;position:sticky;top:calc(var(--top) + 28px);align-self:start;
    max-height:calc(100vh - var(--top) - 56px);max-height:calc(100dvh - var(--top) - 56px);overflow-y:auto;padding-right:6px}
}
.rail .rh{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink4);margin:0 0 var(--sp-3)}
.rail a{display:flex;gap:var(--sp-2);padding:6px 10px;border-radius:var(--r-2);font-size:var(--fs-3);
  color:var(--ink3);transition:background .3s,color .3s;line-height:1.45;position:relative}
.rail a::before{content:"";position:absolute;left:0;top:50%;width:2px;height:0;background:var(--ac);
  transform:translateY(-50%);transition:height .3s var(--ease);border-radius:2px}
.rail a:hover{background:var(--paper);color:var(--ink)}
.rail a.on{background:var(--ac-dim);color:var(--ac-deep)}
.rail a.on::before{height:60%}
.rail a i{font-style:normal;font-family:var(--mono);font-size:var(--fs-1);flex:none;min-width:17px;padding-top:2px;color:var(--ink4)}
/* v16:目录英文分类标签 */
.rail a em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink2);line-height:1.3}   /* v16.14:10px→11px；v16.16:ink4→ink2，对比度 */
.rail a.on i{color:var(--ac)}
.rail a.cv{margin-bottom:var(--sp-2);padding-bottom:var(--sp-2);border-bottom:1px solid var(--line);color:var(--ink3)}
/* V18:六部分组导航标题 */
.part-group{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--ac);
  padding:10px 10px 4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part-group:first-of-type{padding-top:2px}
.tg .part-group{grid-column:1/-1;padding:14px 2px 2px;font-size:12px}
/* V18:章节内TOC */
.ch-toc{margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--paper2);overflow:hidden}
.ch-toc>summary{cursor:pointer;list-style:none;padding:10px 14px;font-size:var(--fs-3);font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
.ch-toc>summary::-webkit-details-marker{display:none}
.ch-toc>summary::before{content:"▸";color:var(--ac);transition:transform .2s}
.ch-toc[open]>summary::before{transform:rotate(90deg)}
.ch-toc nav{padding:2px 14px 12px;display:flex;flex-direction:column;gap:2px}
.ch-toc a{font-size:var(--fs-2);color:var(--ink3);text-decoration:none;padding:3px 0 3px 12px;border-left:2px solid transparent;line-height:1.5}
.ch-toc a.lv4{padding-left:24px;font-size:12px}
.ch-toc a:hover{color:var(--ac)}
.ch-toc a.on{color:var(--ac);border-left-color:var(--ac);font-weight:600}
/* V18:48周时间线 */
.tl-wrap{margin:18px 0;border:1px solid var(--line);border-radius:var(--r-2);background:var(--paper2);overflow:hidden}
.tl-head{padding:10px 14px;font-size:var(--fs-3);font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
.tl-head::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac)}
.tl-scroll{overflow-x:auto;padding:14px;-webkit-overflow-scrolling:touch}
.tl-track{position:relative;display:flex;gap:0;min-width:960px;height:64px}
.tl-track::before{content:"";position:absolute;left:0;right:0;top:31px;height:2px;background:var(--line2)}
.tl-wk{flex:1;position:relative;min-width:0;cursor:default}
.tl-wk::before{content:"";position:absolute;left:50%;top:27px;width:8px;height:8px;border-radius:50%;
  background:var(--ink4);transform:translateX(-50%)}
.tl-wk.ev::before{background:var(--ac);width:12px;height:12px;top:25px;box-shadow:0 0 0 3px var(--ac-dim)}
.tl-wk.ev.race::before{background:var(--amber)}
.tl-wk.ev.rest::before{background:var(--ink3)}
.tl-wk .tl-t{position:absolute;left:50%;transform:translateX(-50%);top:0;font-size:10px;color:var(--ink3);
  white-space:nowrap;font-family:var(--mono)}
.tl-wk .tl-n{position:absolute;left:50%;transform:translateX(-50%);bottom:0;font-size:12px;color:var(--ink4);font-family:var(--mono)}
/* V18:阅读统计模态框 */
.stat-modal{position:fixed;inset:0;z-index:990;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)} /* 2026-10-04:iOS */
.stat-modal.on{display:flex}
.stat-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-3);
  padding:24px;width:min(420px,90vw);max-height:80vh;max-height:80dvh;overflow-y:auto}
.stat-box h3{margin:0 0 16px;font-size:var(--fs-4)}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--fs-3)}
.stat-row:last-child{border-bottom:none}
.stat-row .k{color:var(--ink3)}
.stat-row .v{font-weight:600;font-family:var(--mono)}
.stat-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.stat-bar i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .4s}
.stat-close{margin-top:16px;width:100%}
.stage{min-width:0;padding-bottom:clamp(40px,6vw,80px)}
/* v16.6:移动端底栏 .mrail 固定在底部，.stage 加底栏高度余量，避免末尾按钮被挡 */
@media(max-width:999px){
  .stage{padding-bottom:calc(clamp(40px,6vw,80px) + 68px + env(safe-area-inset-bottom))}   /* v16.11 P2:64→68，mrail 实际约 66px */
}

/* ---------- 转场（无 blur 重影，接近翻书） ---------- */
#stage{transition:opacity .32s var(--ease),transform .32s var(--ease)}
#stage.out{opacity:0;transform:translateY(-12px)}
#stage.enter{opacity:0;transform:translateY(12px);transition:none}

/* ── 跳到正文（键盘 / 读屏用户） ── */
.skip{
  position:absolute;left:-9999px;top:0;z-index:9999;
  background:var(--ac);color:var(--on-ac)   /* v16.16:C2 */;padding:10px 18px;border-radius:0 0 var(--r-3) 0;
  font-family:var(--mono);font-size:var(--fs-2);letter-spacing:.1em;
}
.skip:focus{left:0}

/* ════════════════ 封面 · 杂志式全出血 ════════════════ */
.cover{position:relative;overflow:hidden;margin:0 calc(var(--gut) * -1);
  min-height:min(96vh,940px);min-height:min(96svh,940px);display:flex;flex-direction:column;justify-content:center;
  padding:calc(var(--top) + clamp(40px,9vh,90px)) var(--gut) clamp(40px,6vh,72px);
  background:radial-gradient(120% 90% at 78% 18%,var(--paper2),var(--bg) 62%)}
/* 跑道轨迹（右侧出血背景） */
.cv-track{position:absolute;top:50%;right:-14%;width:min(96vw,980px);transform:translateY(-50%);
  z-index:0;pointer-events:none}
.cv-track svg{width:100%;height:auto;display:block}
/* 起跑口令 */
.marks{position:absolute;left:var(--gut);bottom:clamp(20px,4vh,40px);z-index:1;
  font-family:var(--mono);font-size:var(--fs-1);line-height:2;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink3);margin:0}
.marks b{display:block;color:var(--ac);font-weight:600;letter-spacing:.3em}
/* 大数字 54（精神图腾，出血裁切） */
/* V18:成年礼徽章 */
.coming-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1.5px solid var(--ac);border-radius:999px;font-size:13px;letter-spacing:.1em;color:var(--ac);background:var(--ac-dim);}
.coming-badge b{font-size:16px;}
.cvnum{position:absolute;right:calc(var(--gut) * -.35);bottom:-.14em;z-index:0;
  font-family:var(--display);font-weight:700;font-size:clamp(10rem,30vw,24rem);line-height:.78;
  letter-spacing:-.08em;color:var(--title);opacity:.035;user-select:none;pointer-events:none}   /* v16.1:封面54再降一级 */
.cover>*:not(.cv-track):not(.cvnum):not(.marks){position:relative;z-index:1} /* v16.8:装饰层保持 absolute */
.kick{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.24em;text-transform:uppercase;
  color:var(--ac);margin:0 0 var(--sp-5);display:flex;align-items:center;gap:var(--sp-3)}
.kick::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent);max-width:140px}
/* 主标题：分道起跑错位 */
.ctitle{font-family:var(--display);font-weight:700;color:var(--title);line-height:.94;margin:0 0 var(--sp-5)}
.ctitle span{display:block}
.ctitle .l1{font-size:clamp(1.4rem,3.2vw,2.4rem);font-weight:600;color:var(--ink3);
  letter-spacing:.04em;margin-bottom:.12em}
.ctitle .l2{font-size:clamp(3.6rem,11vw,7.8rem);letter-spacing:-.05em;margin-left:-.02em}
.ctitle .l3{font-size:clamp(2.1rem,5.6vw,4.2rem);letter-spacing:-.015em;color:var(--ac-deep);
  margin-left:.16em;margin-top:.1em}
.hsub{color:var(--ink2);max-width:52ch;font-size:clamp(var(--fs-4),1.5vw,var(--fs-6));margin:0 0 clamp(26px,3.4vw,40px)}
/* 载入编排 */
.js .cover .kick,.js .cover .ctitle,.js .cover .hsub,.js .cover .hstats,.js .cover .htags,
.js .cover .cgrid,.js .cover .go,.js .cover .marks,.js .cover .todaymod,.js .cover .tl-wrap{ /* 2026-10-04:补todaymod/tl-wrap入场动画 */
  opacity:0;transform:translateY(18px) scale(.99);animation:rise 1s var(--ease) forwards;animation-delay:var(--ld,0ms)}
@keyframes rise{to{opacity:1;transform:none}}
.js .cover .cvnum{opacity:0;animation:numIn 2.2s var(--ease) .5s forwards}
@keyframes numIn{to{opacity:.055}}
.js .cover .cv-track{opacity:0;transform:translateY(-50%) translateX(4%);animation:tkIn 2s var(--ease) .25s forwards}
@keyframes tkIn{to{opacity:1;transform:translateY(-50%) translateX(0)}}

/* 封面数据卡 */
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-4);overflow:hidden;max-width:820px}
.hstat{background:var(--paper);padding:var(--sp-4) var(--sp-4);transition:background .35s,transform .4s var(--ease);
  display:flex;flex-direction:column}   /* v16.8:描述行底部对齐 */
.hstat:hover{background:var(--paper2);transform:translateY(-2px)}
.hstat .k{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4)}
.hstat .v{font-family:var(--mono);font-size:clamp(var(--fs-6),2.2vw,var(--fs-7));font-weight:600;letter-spacing:-.02em;
  margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--title);text-shadow:var(--glow)}
.hstat .v small{font-size:.58em;color:var(--ink3);font-weight:400;margin-left:2px}
.hstat .d{font-size:var(--fs-2);color:var(--ink3);margin-top:auto;padding-top:4px;line-height:1.5}
.htags{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-4)}
.htags span{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.05em;color:var(--ink3);
  border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--paper)}
.htags span.hot{color:var(--ac-deep);border-color:color-mix(in srgb,var(--ac) 34%,transparent);background:var(--ac-dim)}

/* 封面章节网格 */
.cgrid{margin-top:clamp(26px,3.6vw,44px);max-width:1000px}
.cgrid .sh{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink4);margin:0 0 var(--sp-4)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:var(--sp-2)}
.tg a{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-3);
  padding:13px 15px;transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease);position:relative;overflow:hidden}
.tg a::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ac);
  transform:scaleY(0);transform-origin:top;transition:transform .45s var(--ease)}
.tg a:hover{transform:translateY(-1px);border-color:var(--border-default)}   /* v16:hover 只做轻微精致化 */
.tg a:hover::after{transform:scaleY(1)}
.tg a i{display:block;font-style:normal;font-family:var(--mono);font-size:var(--fs-2);color:var(--ac);letter-spacing:.08em}
.tg a em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink2);margin-top:4px}   /* v16.14:10px→11px */
.tg a span{display:block;font-size:var(--fs-3);color:var(--ink2);margin-top:4px;line-height:1.45}
.go{display:inline-flex;align-items:center;gap:var(--sp-2);margin-top:clamp(24px,3.4vw,38px);
  background:var(--ac);color:var(--on-ac);border-radius:var(--r-3);padding:13px 24px;font-size:var(--fs-4);   /* v16.16:C2 */
  font-weight:600;transition:transform .5s var(--ease),box-shadow .5s var(--ease),background .3s;box-shadow:var(--sh1)}
.go:hover{transform:translateY(-3px);background:var(--ac);background:color-mix(in srgb,var(--ac) 88%,#fff);box-shadow:var(--sh2),0 0 30px -6px var(--ac)}   /* v16.12:跟 --ac 走，浅色不跳变 */
.go span{font-family:var(--mono);font-size:var(--fs-2);opacity:.7}

/* ════════════════ 章节开场 · 杂志式全出血 ════════════════ */
.chhead{position:relative;margin:0 calc(var(--gut) * -1);
  padding:calc(var(--top) + clamp(30px,6vh,64px)) var(--gut) clamp(34px,5vh,56px);
  background:linear-gradient(180deg,var(--paper2),var(--bg) 80%);
  border-bottom:1px solid var(--line);overflow:hidden}
.chhead::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--phc,var(--ac))}
.chnum{position:absolute;right:calc(var(--gut) * .2);top:50%;transform:translateY(-50%);
  font-family:var(--display);font-weight:700;font-size:clamp(5rem,17vw,11rem);line-height:.8;
  letter-spacing:-.06em;color:var(--title);opacity:.07;user-select:none;pointer-events:none}
.chlap{display:inline-flex;align-items:center;gap:var(--sp-2);font-family:var(--mono);
  font-size:var(--fs-2);letter-spacing:.14em;text-transform:uppercase;color:var(--phc,var(--ac));
  margin:0 0 var(--sp-3)}
/* v16.1:去掉 LAP 前旋转圆环，更干净 */
.chlap::before{display:none}
/* v16:章节头信息层级 LAP → 第X圈 → 标题 → 英文副标题 */
.chlapzh{font-size:var(--fs-4);letter-spacing:.28em;color:var(--ink2);margin:var(--sp-2) 0 0}
.chsub{font-family:var(--mono);font-size:var(--fs-2);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin:var(--sp-3) 0 0}
.chhead h2{font-family:var(--display);font-size:clamp(1.8rem,4.6vw,3.2rem);line-height:1.1;
  letter-spacing:-.015em;font-weight:700;color:var(--title);margin:0;max-width:16ch;text-wrap:balance}
.chbar{width:1px;height:clamp(26px,4vh,40px);background:var(--phc,var(--ac));margin:var(--sp-5) 0 0 2px;
  position:relative}
.chbar::after{content:"";position:absolute;left:-3.5px;bottom:0;width:8px;height:8px;border-radius:1px;
  background:var(--phc,var(--ac))}
.js .chhead .chnum{opacity:0;transform:translateY(-50%) translateX(6%);animation:chnIn 1s var(--ease) forwards}
@keyframes chnIn{to{opacity:.07;transform:translateY(-50%) translateX(0)}}
.js .chhead .chlap{opacity:0;animation:rise .8s var(--ease) .1s forwards}
.js .chhead .chlapzh{opacity:0;animation:rise .8s var(--ease) .14s forwards}
.js .chhead h2{opacity:0;transform:translateY(16px);animation:rise .9s var(--ease) .18s forwards}
.js .chhead .chsub{opacity:0;animation:rise .8s var(--ease) .24s forwards}
.js .chhead .chbar{transform:scaleY(0);transform-origin:top;animation:chbarIn .9s var(--ease) .34s forwards}
@keyframes chbarIn{to{transform:scaleY(1)}}
.chbody{padding-top:var(--sp-6);max-width:880px}

/* ════════════════ 正文排版 ════════════════ */
.chbody h2,.chbody h3,.chbody h4,#printall h4{scroll-margin-top:calc(var(--top) + 24px)}
.chbody h2,#printall h2{font-family:var(--display);font-size:clamp(var(--fs-8),2.8vw,2rem);line-height:1.2;letter-spacing:-.01em;
  font-weight:700;color:var(--title);margin:clamp(40px,6vw,72px) 0 var(--sp-4);padding-top:clamp(22px,3.4vw,34px);
  border-top:1px solid var(--line);text-wrap:balance}
.chbody h3,#printall h3{font-size:clamp(var(--fs-6),1.9vw,var(--fs-7));line-height:1.35;letter-spacing:-.01em;font-weight:600;
  color:var(--ink);margin:clamp(28px,4vw,44px) 0 var(--sp-3);padding-left:14px;position:relative}
.chbody h3::before,#printall h3::before{content:"";position:absolute;left:0;top:.42em;width:4px;height:.85em;border-radius:2px;
  background:var(--ac);opacity:.6}
.chbody h4,#printall h4{font-size:var(--fs-5);font-weight:600;margin:22px 0 var(--sp-2);letter-spacing:-.01em;color:var(--ink)}
.chbody p,#printall p{margin:0 0 15px;color:var(--ink2);max-width:78ch}
.chbody ul,#printall ul,.chbody ol,#printall ol{margin:0 0 15px;padding-left:22px;color:var(--ink2);max-width:78ch}
.chbody li,#printall li{margin:6px 0}
.chbody li::marker,#printall li::marker{color:var(--ink4)}
.chbody strong,#printall strong,.chbody b,#printall b{color:var(--ink);font-weight:600}
.chbody code,#printall code{font-family:var(--mono);font-size:.86em;background:var(--paper2);border:1px solid var(--line);
  border-radius:var(--r-1);padding:1px 6px;color:var(--ink2);white-space:nowrap;letter-spacing:-.02em}
.chbody hr,#printall hr{border:0;border-top:1px solid var(--line);margin:34px 0}
/* v16.12:删 .wrap 死代码 */
.need{color:var(--ac)!important;font-weight:600}
.hl{color:var(--ink)!important;font-weight:600}
.opt,.small,.mut{color:var(--ink3)!important;font-size:.92em}
.hot{color:var(--warm)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.it{color:var(--ink2)}
/* v16.8:时间线阶段色——b 蓝 / g 绿 / a 琥珀 */
.tl .it.b::before{border-color:#4a9eff;background:color-mix(in srgb,#4a9eff 22%,var(--bg))}
.tl .it.g::before{border-color:#4dd4ad;background:color-mix(in srgb,#4dd4ad 22%,var(--bg))}
.tl .it.a::before{border-color:#e3b23c;background:color-mix(in srgb,#e3b23c 22%,var(--bg))}

/* ════════════════ callout ════════════════ */
.callout{border:1px solid var(--line);border-left:2px solid var(--ac);background:var(--paper);
  border-radius:var(--r-3);padding:17px 20px;margin:18px 0;
  transition:border-color .4s,box-shadow .45s var(--ease),transform .45s var(--ease)}
.callout:hover{transform:translateX(3px);box-shadow:var(--sh2)}
.callout .lbl{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:var(--fs-1);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ac-deep);margin:0 0 10px}
.callout .lbl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 0 4px var(--ac-dim);flex:none}
.callout p{margin:0 0 9px;color:var(--ink2)}
.callout p:last-child{margin-bottom:0}
.callout.danger{border-left-color:var(--bad);background:var(--paper);background:color-mix(in srgb,var(--bad) 7%,var(--paper))}
.callout.danger .lbl{color:var(--bad)}.callout.danger .lbl::before{background:var(--bad);box-shadow:0 0 0 4px rgba(240,86,72,.15)}
.callout.good{border-left-color:var(--ok);background:var(--paper);background:color-mix(in srgb,var(--ok) 6%,var(--paper))}
.callout.good .lbl{color:var(--ok)}.callout.good .lbl::before{background:var(--ok);box-shadow:0 0 0 4px rgba(45,212,168,.14)}
.callout.warn{border-left-color:var(--warn);background:var(--paper);background:color-mix(in srgb,var(--warn) 7%,var(--paper))}
.callout.warn .lbl{color:var(--warn)}.callout.warn .lbl::before{background:var(--warn);box-shadow:0 0 0 4px rgba(227,178,60,.14)}

/* ════════════════ card ════════════════ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-4);padding:18px 20px;margin:14px 0;
  box-shadow:var(--sh1);transition:transform .55s var(--ease),border-color .45s,box-shadow .55s var(--ease)}
.card.tight{padding:12px 15px;margin:10px 0} /* 2026-10-13:紧凑版卡片，补P1-6缺失的样式 */
.card.tight h4{margin-bottom:4px}
.card:hover{transform:translateY(-1px);border-color:var(--border-default)}   /* v16:hover 轻微化 */
.card h4{margin-top:0!important}
.card p,.card li{font-size:var(--fs-4)}
.grid2,.grid3{display:grid;gap:14px;margin:16px 0}
.grid2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid2 .card,.grid3 .card{margin:0}

/* ════════════════ 表格（跑道边缘 hover） ════════════════ */
/* v16:表格编辑化——去外框卡片，保留细分隔线，加大行间距 */
.tblwrap{overflow-x:auto;margin:20px 0;border-bottom:1px solid var(--line)}
.tblwrap table{width:100%;border-collapse:collapse;font-size:var(--fs-4);min-width:440px}
.tblwrap caption{caption-side:top;text-align:left;font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.1em;
  color:var(--ac-deep);padding:11px 15px;background:var(--paper2);border-bottom:1px solid var(--line)}
.tblwrap th{text-align:left;font-weight:500;font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink4);padding:11px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap;background:var(--paper2)}
.tblwrap td:first-child{white-space:nowrap}   /* v16.8:首列不换行，「热痉挛」不再被压成两行 */
.tblwrap td{padding:13px 14px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tblwrap tbody tr:nth-child(even){background:var(--paper2);background:color-mix(in srgb,var(--paper2) 50%,transparent)}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap td:first-child{color:var(--ink)}
.tblwrap tbody tr{position:relative;transition:background .3s}
.tblwrap tbody tr:hover{background:var(--ac-dim)}
#stage .tblwrap tbody tr:nth-child(even):hover td{background:transparent}   /* v16.12:特异性(1,3,3)直接胜出，修 v16.10 未生效的 hover */
.tblwrap tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--ac)}
.c,.tblwrap .c{text-align:center}
.tblwrap td.green{color:#4dd4ad}.tblwrap td.amber{color:#e3b23c}
.tblwrap td.red{color:#f07a6e}.tblwrap td.blue{color:#6fb4e8}
.tblwrap td.b,.tblwrap td.a{color:var(--ink);font-weight:600}
/* 装备表里的价格单元格：等宽 + 表格数字（原文用了 class="price" 但样式表缺失） */
.tblwrap td.price,.tblwrap th.price{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;color:var(--title);font-weight:600;white-space:nowrap}
.tblwrap td.price.opt{color:var(--ink3);font-weight:400}
@media (prefers-color-scheme: light){
  :root:not([data-theme]) .tblwrap td.green{color:#1f7a5f}:root:not([data-theme]) .tblwrap td.amber{color:#a5771c}
  :root:not([data-theme]) .tblwrap td.red{color:#a03a2e}:root:not([data-theme]) .tblwrap td.blue{color:#2d6ba3}
}

/* ════════════════ pill / tag ════════════════ */
.pill{display:inline-block;font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.1em;padding:3px 9px;
  border-radius:99px;border:1px solid var(--line2);color:var(--ink2);background:var(--paper);white-space:nowrap}
.pill.p-green{color:#4dd4ad;border-color:rgba(45,212,168,.32);background:rgba(45,212,168,.1)}
.pill.p-red{color:#f07a6e;border-color:rgba(240,86,72,.32);background:rgba(240,86,72,.1)}
.pill.p-amber{color:#e3b23c;border-color:rgba(227,178,60,.32);background:rgba(227,178,60,.1)}
.pill.p-blue{color:#6fb4e8;border-color:rgba(79,160,216,.32);background:rgba(79,160,216,.1)}
.pill.p-gray{color:var(--ink3)}
/* v16.12:删 .tags 死代码 */
.tag{font-family:var(--mono);font-size:var(--fs-2);color:var(--ink3);border:1px solid var(--line);
  border-radius:99px;padding:5px 12px;background:var(--paper)}
.tag.hot{color:var(--ac-deep);border-color:color-mix(in srgb,var(--ac) 32%,transparent);background:var(--ac-dim)}

/* ════════════════ stat ════════════════ */
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-3);padding:15px 17px;
  box-shadow:var(--sh1);transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease)}
.stat:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sh2)}
.stat .k{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4)}
.stat .v{font-family:var(--mono);font-size:var(--fs-7);font-weight:600;letter-spacing:-.03em;margin:6px 0 4px;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--title);text-shadow:var(--glow)}
.stat .v.blue{color:var(--ice)}.stat .v.amber{color:var(--warn)}
.stat .v.green{color:var(--ok)}.stat .v.red{color:var(--bad)}
.stat .d{font-size:var(--fs-3);color:var(--ink3);line-height:1.5}

/* ════════════════ timeline ════════════════ */
.tl{margin:16px 0;border-left:1px solid var(--line);padding-left:0}
.tl .it{position:relative;padding:0 0 18px 26px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{content:"";position:absolute;left:-5px;top:9px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--ink4)}
.tl .h{font-weight:600;font-size:var(--fs-5);letter-spacing:-.01em;margin-bottom:5px;display:flex;flex-wrap:wrap;
  gap:8px;align-items:center;color:var(--ink)}
.tl .b{color:var(--ink2);font-size:var(--fs-4)}

/* ════════════════ lead / box ════════════════ */
/* v16.1:lead 去卡片化——变为 Flow 层，只保留 mono 小标签 */
.lead{margin:20px 0;padding:0}
.lead .h{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.18em;text-transform:uppercase;color:var(--ac-deep);margin-bottom:9px}
.lead ul{margin:0;padding-left:20px}
.lead li{font-size:var(--fs-4)}
.box{border:1px solid var(--line);border-left:2px solid var(--ink4);border-radius:var(--r-2);background:var(--paper);
  padding:16px 19px;margin:16px 0}   /* v16.1:去阴影，更扁平 */
.box .h{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin-bottom:9px}
.box.ok{border-left-color:var(--ok);background:var(--paper);background:color-mix(in srgb,var(--ok) 6%,var(--paper))}
.box.ok .h{color:var(--ok)}
.box.warn{border-left-color:var(--warn);background:var(--paper);background:color-mix(in srgb,var(--warn) 6%,var(--paper))}
.box.warn .h{color:var(--warn)}
.box.stop{border-left-color:var(--bad);background:var(--paper);background:color-mix(in srgb,var(--bad) 6%,var(--paper))}
.box.stop .h{color:var(--bad)}
.box ol,.box ul{margin:0;padding-left:20px}
.box li{font-size:var(--fs-4)}

/* ════════════════ quick / pace / gear ════════════════ */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}
.quick a{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-4);padding:17px 18px;
  box-shadow:var(--sh1);transition:transform .55s var(--ease),border-color .45s,box-shadow .55s var(--ease)}
.quick a:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--ac) 38%,transparent);box-shadow:var(--sh2)}
.quick .k{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.16em;text-transform:uppercase;color:var(--ac-deep)}
.quick .v{font-size:var(--fs-6);font-weight:600;letter-spacing:-.015em;margin:9px 0 5px;color:var(--title)}
.quick .d{font-size:var(--fs-3);color:var(--ink3);line-height:1.5}
/* v16.12:删 .pacegrid 死代码 */
.pace{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-3);padding:14px;box-shadow:var(--sh1);
  transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease)}
.pace:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sh2)}
.pace .k{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.12em;color:var(--ink4);text-transform:uppercase}
.pace .v{font-family:var(--mono);font-size:clamp(var(--fs-6),2.4vw,var(--fs-7));font-weight:600;letter-spacing:-.03em;
  margin:6px 0 3px;font-variant-numeric:tabular-nums;color:var(--title);text-shadow:var(--glow)}
.pace .v small{font-size:.52em;color:var(--ink3);font-weight:400}
.pace .d{font-family:var(--mono);font-size:var(--fs-2);color:var(--ink3);letter-spacing:-.02em}
/* v16.12:删 .gear 死代码（装备章已改表格） */
/* v16.12:删 .badge 死代码（含 v16.8 浅色覆盖） */

/* ════════════════ 引用 / 参考 ════════════════ */
.quote{border-left:2px solid var(--ac);padding:2px 0 2px 18px;margin:18px 0;color:var(--ink);font-size:var(--fs-5)}
.ref{font-family:var(--mono);font-size:var(--fs-2);color:var(--ink4);line-height:1.75;margin:10px 0;
  padding-left:18px;border-left:1px solid var(--line)}
/* v16.7:可复制文案块——用设计 token，深浅色自适应 */
/* v16.10 A5:提权到 (0,2,1)，压过 .chbody p (0,1,1)；print 下 #printall 另行覆盖 */
.chbody p.quote-box,#printall .quote-box{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r-2);
  padding:12px 14px;font-size:13.5px;color:var(--ink);line-height:1.75;margin:10px 0}

/* ════════════════ 章间导航 ════════════════ */
.chnav{display:flex;gap:10px;margin-top:clamp(34px,5vw,60px);padding-top:22px;border-top:1px solid var(--line);max-width:880px}
.chbtn{flex:1;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r-3);
  background:var(--paper);padding:14px 17px;text-align:left;box-shadow:var(--sh1);
  transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease)}
.chbtn:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sh2)}
.chbtn.next{text-align:right;align-items:flex-end}
.chbtn .k{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4)}
.chbtn .v{font-size:var(--fs-4);color:var(--ink2);line-height:1.4}
.chbtn:hover .v{color:var(--ink)}
.chbtn[disabled]{opacity:.32;pointer-events:none}

/* ════════════════ 数据可视化（签名组件） ════════════════ */
.vizwrap{border:1px solid var(--line2);border-radius:var(--r-4);background:var(--paper);margin:0 0 26px;
  overflow:hidden;box-shadow:var(--sh1)}
.vizwrap .vth{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:14px 17px;
  border-bottom:1px solid var(--line);background:var(--paper2)}
.vizwrap .vth b{font-size:var(--fs-4);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--title)}
.vizwrap .vth b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 0 4px var(--ac-dim);flex:none}
.vizwrap .vth em{font-style:normal;font-family:var(--mono);font-size:var(--fs-2);color:var(--ink3);letter-spacing:.06em}
/* V18:图表类型切换按钮 */
.mctoggle{margin-left:auto;font-family:var(--mono);font-size:var(--fs-2);color:var(--ink2);
  background:var(--paper2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;
  transition:all .25s var(--ease)}
.mctoggle:hover{color:var(--ac);border-color:var(--ac)}
.mctoggle:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.vizwrap .vb{padding:16px 17px}
@media(max-width:640px){.vizwrap .vb{overflow-x:auto}.vizwrap .vb .mchart{min-width:384px}}   /* v16.13:窄屏 48 列横滚，每列 ≥8px 可辨 */
/* 48 周曲线 */
.mchart{width:100%;height:auto;display:block;position:relative}   /* v16.13:tip 定位基准 */
/* v16.11 P3:删旧 SVG 图表死规则 (.axis/.gl/.lb/.curl/.curc，现用 div 画柱) */
.mchart .bar{opacity:.8;transition:opacity .25s,filter .25s}
.mchart .bar.muted{opacity:.42}
/* v16.10 A7:键盘 roving 选中的柱子 */
.mchart .bar[data-active="1"]{opacity:1;outline:2px solid var(--ac);outline-offset:2px}
.mchart.dim .bar{opacity:.35}
.mchart.dim .bar.hot{opacity:1;filter:brightness(1.4)}
/* v16.11 P3:删 .curl/.curc 死规则（旧 SVG 遗留） */
.mtip{position:absolute;pointer-events:none;background:var(--paper3);border:1px solid var(--line2);
  border-radius:var(--r-2);padding:9px 12px;font-family:var(--mono);font-size:var(--fs-2);color:var(--ink);
  opacity:0;transform:translate(-50%,-130%) scale(.96);transition:opacity .25s,transform .35s var(--ease);
  z-index:10;white-space:nowrap;box-shadow:var(--sh2)}
.mtip.on{opacity:1;transform:translate(-50%,-130%) scale(1)}
.mtip .k{color:var(--ink3);display:block;font-size:var(--fs-1);letter-spacing:.08em;margin-bottom:3px}
.mtip .v{color:var(--ac);font-weight:600;font-size:var(--fs-5);letter-spacing:-.02em}
/* 配速跑道条 */
.pbars{display:grid;gap:11px}
.pbar{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-3);align-items:center}
.pbar .nm{width:74px;font-family:var(--mono);font-size:var(--fs-2);color:var(--ink2)}
.pbar .nm b{display:block;color:var(--title);font-weight:600;font-size:var(--fs-4)}
.pbar .tr{position:relative;height:30px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r-2)}   /* v16.14:去 overflow:hidden，窄屏标签不被裁（fill 自带圆角收边） */
.pbar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:var(--r-1);   /* v16.18:四角圆角，98%宽度不露直角 */
  transition:width 1.2s var(--ease)}
.pbar .tm{position:absolute;top:50%;font-family:var(--mono);
  font-size:var(--fs-2);color:var(--title);letter-spacing:-.02em;white-space:nowrap;
  left:calc(var(--w,50%) - 8px);transform:translate(-100%,-50%)}   /* v16.9:贴 fill 末端内侧 */
  /* v16.10 A2:窄屏回退居中，避免 E 档标签被 overflow:hidden 裁掉 */
@media (max-width:600px){.pbar .tm{left:50%;transform:translate(-50%,-50%)}}
  /* v16.8:.tm.lt 已废弃，标签位置改由 CSS 变量 --w 控制 */
/* 热力周历 */
.heat{display:grid;grid-auto-flow:column;grid-auto-rows:1fr;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat:focus-visible{outline:2px solid var(--ac);outline-offset:2px}   /* v16.22:键盘焦点可见 */
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;min-width:16px} /* 2026-10-04:格子可辨 */
.heat .c{aspect-ratio:1;border-radius:2px;background:var(--paper2);border:1px solid var(--line);
  transition:transform .2s,box-shadow .2s;cursor:default}
.heat .c:hover{transform:scale(1.5);box-shadow:var(--sh2);z-index:2;position:relative}
.heatcap{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.heatcap span{font-family:var(--mono);font-size:var(--fs-2);color:var(--ink3);display:flex;align-items:center;gap:5px}
.heatcap i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* 400m 圈符号 */
.lapdot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ac);
  border-top-color:transparent;transform:rotate(45deg);margin-right:6px;vertical-align:-1px}

/* ════════════════ 交互工具 ════════════════ */
.tool{border:1px solid var(--line2);border-radius:var(--r-4);margin:0 0 26px;overflow:hidden;
  background:var(--paper);box-shadow:var(--sh1)}
.tool .th{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:14px 17px;
  border-bottom:1px solid var(--line);background:var(--paper2)}
.tool .th b{font-size:var(--fs-4);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--title)}
.tool .th b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 0 4px var(--ac-dim);flex:none}
.tool .th em{font-style:normal;font-family:var(--mono);font-size:var(--fs-2);color:var(--ink3);letter-spacing:.06em}
/* v16.1:保守版/原版切换开关 */
.pvsw{margin-left:auto;display:inline-flex;border:1px solid var(--border-default);border-radius:var(--radius-sm);overflow:hidden}
.pvsw button{border:0;background:none;padding:6px 12px;font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.08em;color:var(--ink3);cursor:pointer}
.pvsw button.on{background:var(--ac-dim);color:var(--ac)}
.tool .tb{padding:16px 17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:var(--fs-2);padding:6px 11px;border-radius:99px;border:1px solid var(--line);
  color:var(--ink3);background:var(--paper);transition:all .3s var(--ease);letter-spacing:-.02em}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:600}   /* v16.16:C2 */
.pout{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:15px}
.hint{font-size:var(--fs-3);color:var(--ink3);margin-top:10px}   /* v16.14:工具空态说明 */
.po{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r-3);padding:11px 12px;
  transition:border-color .3s,transform .4s var(--ease)}
.po:hover{transform:translateY(-2px)}
.po .k{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)   /* v16.16:C1 对比度，ink4→ink3 */}
.po .v{font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums;margin-top:4px;
  letter-spacing:-.02em;color:var(--title);text-shadow:var(--glow);display:block}
.po .v.up{animation:numUp .5s var(--ease)}
@keyframes numUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.po .l{font-family:var(--mono);font-size:var(--fs-1);color:var(--ink3);margin-top:2px;letter-spacing:-.02em}
.po.e{border-color:rgba(45,212,168,.3)}.po.e .v{color:#4dd4ad}
.po.t{border-color:rgba(227,178,60,.3)}.po.t .v{color:#e3b23c}
.po.i{border-color:rgba(240,134,74,.3)}.po.i .v{color:#f0965e}
.po.r{border-color:rgba(240,86,72,.3)}.po.r .v{color:#f07a6e}
/* v16.8:浅色模式霓虹色加深（深色底 1.7:1 → 浅色底 4.5:1+） */
@media (prefers-color-scheme: light){
  :root:not([data-theme]) .pill.p-green{color:#1f7a5f;border-color:rgba(31,122,95,.4);background:rgba(31,122,95,.08)}
  :root:not([data-theme]) .pill.p-red{color:#a03a2e;border-color:rgba(160,58,46,.4);background:rgba(160,58,46,.08)}
  :root:not([data-theme]) .pill.p-amber{color:#a5771c;border-color:rgba(165,119,28,.4);background:rgba(165,119,28,.08)}
  :root:not([data-theme]) .pill.p-blue{color:#2d6ba3;border-color:rgba(45,107,163,.4);background:rgba(45,107,163,.08)}
  :root:not([data-theme]) .po.e .v{color:#1f7a5f}:root:not([data-theme]) .po.t .v{color:#a5771c}:root:not([data-theme]) .po.i .v{color:#b45a1a}:root:not([data-theme]) .po.r .v{color:#a03a2e}
}
.po.m .v{color:var(--ice)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
  background:var(--paper3);outline:0;margin:6px 0 4px}
input[type=range]:focus-visible{outline:2px solid var(--ac);outline-offset:4px}   /* v16.16:C4 焦点环 */
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ac);border:3px solid var(--paper);cursor:grab;box-shadow:0 0 0 1px var(--ac)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ac);
  border:3px solid var(--paper);cursor:grab}
.wkrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-top:6px}
.wkrow .big{font-family:var(--mono);font-size:clamp(1.7rem,4vw,2.3rem);font-weight:600;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--title);text-shadow:var(--glow);display:inline-block}
.wkrow .big small{font-size:.45em;color:var(--ink3);font-weight:400;margin-left:3px}
.wkrow .meta{font-family:var(--mono);font-size:var(--fs-2);color:var(--ink3);letter-spacing:.05em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:16px}
.day{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r-2);padding:9px 4px;text-align:center}
.day .d{font-family:var(--mono);font-size:var(--fs-1);color:var(--ink3)   /* v16.16:C1 对比度，ink4→ink3 */}
.day .v{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--title)}
.day.q .v{color:var(--ac)}
.day.z .v{color:var(--ink4)}
.lvrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lv{flex:1;min-width:110px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r-3);
  padding:11px 13px;transition:all .4s var(--ease)}
.lv.hit{border-color:var(--ac);background:var(--ac-dim)}
.err{color:var(--bad);font-size:var(--fs-4);padding:10px 12px;border:1px solid var(--bad);border-radius:var(--r-2);background:var(--paper);background:color-mix(in srgb,var(--bad) 8%,transparent)}   /* v16.13:统一错误文案样式 */
.lv .k{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)   /* v16.16:C1 对比度，ink4→ink3 */}
.lv .v{font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--title);letter-spacing:-.02em}
.lv.hit .v{color:var(--ac);text-shadow:var(--glow)}
.lv .d{font-size:var(--fs-3);color:var(--ink3);margin-top:3px}
.tin{display:flex;flex-wrap:wrap;gap:8px}
.tin select,.tin input{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r-2);color:var(--ink);
  font-family:var(--mono);font-size:var(--fs-4);padding:10px 13px;outline:0;letter-spacing:-.02em}
.tin input{min-width:130px}
.tin select:focus,.tin input:focus{border-color:var(--ac)}

/* ════════════════ 聚光灯（暗色下用极淡青绿辉光） ════════════════ */
.spot{position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;inset:-1px;border-radius:inherit;opacity:0;pointer-events:none;z-index:0;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),
    rgba(43,217,190,.12),transparent 62%);transition:opacity .45s}
.spot:hover::before{opacity:1}
.spot>*{position:relative;z-index:1}
@media (prefers-color-scheme: light){
  :root:not([data-theme]) .spot::before{background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),
    rgba(33,121,107,.09),transparent 62%)}
}

/* ════════════════ 抽屉 / 命令面板 ════════════════ */
.drawer{position:fixed;inset:0;z-index:950;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--top) + 18px) var(--gut) calc(30px + env(safe-area-inset-bottom));   /* v16.11 P2:safe-area */
  overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.drawer.on{opacity:1;visibility:visible}
.drawer .dh{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink4);margin-bottom:14px}
.drawer a{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--fs-5);color:var(--ink2)}
.drawer a i{font-style:normal;font-family:var(--mono);font-size:var(--fs-2);color:var(--ac);min-width:22px}
.drawer a.on{color:var(--ink)}
.pal{position:fixed;inset:0;z-index:980;background:var(--bg);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);   /* v16.11 P2:跟主题走，不再硬编码深色 */
  -webkit-backdrop-filter:blur(16px);display:flex;align-items:flex-start;justify-content:center;
  padding:14vh 16px 30px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.pal.on{opacity:1;visibility:visible}
.palbox{width:min(620px,100%);background:var(--paper);border:1px solid var(--line2);border-radius:var(--r-4);
  overflow:hidden;box-shadow:var(--sh2);transform:translateY(-10px) scale(.99);transition:transform .45s var(--ease)}
.pal.on .palbox{transform:none}
.palbox input{width:100%;background:transparent;border:0;outline:0;color:var(--ink);font-size:var(--fs-5);
  padding:17px 20px;border-bottom:1px solid var(--line)}
.palbox input::placeholder{color:var(--ink4)}
.palbox input:focus{border-bottom-color:var(--ac);box-shadow:0 1px 0 var(--ac)}
.palres{max-height:min(52vh,420px);overflow-y:auto}
.palres a{display:flex;gap:12px;padding:11px 20px;font-size:var(--fs-4);color:var(--ink2);
  border-bottom:1px solid var(--line);position:relative}
.palres a::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ac);
  transform:scaleY(0);transition:transform .3s var(--ease)}
.palres a:last-child{border-bottom:0}
.palres a i{font-style:normal;font-family:var(--mono);font-size:var(--fs-2);color:var(--ac);flex:none;padding-top:3px}
.palres a span{display:block;min-width:0}
.palres a b{display:block;color:var(--ink);font-weight:600}
.palres a em{display:block;font-style:normal;font-size:var(--fs-2);color:var(--ink3);margin-top:3px;line-height:1.55}
.palres mark{background:rgba(43,217,190,.30);color:inherit;border-radius:2px;padding:0 1px}
.palres .none b{font-family:var(--mono);letter-spacing:.1em;color:var(--ink2);font-size:var(--fs-2)}
.palres a.on,.palres a:hover{background:var(--ac-dim);color:var(--ink)}
.palres a.on::before,.palres a:hover::before{transform:scaleY(1)}
.palres .none{padding:22px 20px;color:var(--ink4);font-size:var(--fs-4)}
.palf{padding:10px 20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:var(--fs-1);
  color:var(--ink4);letter-spacing:.06em}

/* 移动端章条 */
.mrail{position:fixed;z-index:940;left:0;right:0;bottom:0;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
@media(min-width:1000px){.mrail{display:none}}
.mrail button{flex:1;border:1px solid var(--line);border-radius:var(--r-2);padding:12px 8px;background:var(--paper);   /* v16.11 P3:40→约44px 触控高度 */
  font-family:var(--mono);font-size:var(--fs-2);color:var(--ink2);transition:all .3s var(--ease)}
.mrail button:hover{background:var(--paper2);color:var(--ink)}
.mrail button[disabled]{opacity:.3}
/* v16:移动端中间章节指示 LAP 08/23 + 细进度线 */
.mrail .mmid{flex:1.4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0}
.mrail .mmid span{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.1em;color:var(--ink3);white-space:nowrap}
.mrail .mmid #mProg{display:block;width:100%;height:2px;background:var(--line);border-radius:1px;text-decoration:none;overflow:hidden}
.mrail .mmid #mProg i{display:block;height:100%;width:0;background:var(--ac);border-radius:1px;transition:width .3s var(--ease)}
/* v16: TODAY / CURRENT PHASE 模块 —— Level A 数据卡 */
.todaymod{margin:26px 0;padding:20px 22px;border:1px solid var(--border-default);
  border-radius:var(--radius-md);background:var(--paper)}
.tm-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tm-k{font-family:var(--mono);font-size:var(--fs-2);letter-spacing:.14em;color:var(--ac)}
.tm-date{font-family:var(--mono);font-size:var(--fs-2);color:var(--ink3)}
.tm-phase{font-family:var(--mono);font-size:var(--fs-1);letter-spacing:.12em;color:var(--ink4);margin-bottom:6px}
.tm-big{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.2rem);color:var(--title);line-height:1.15}
.tm-sub{margin-top:8px;font-size:var(--fs-3);color:var(--ink2)}
/* v16.9:TODAY 本周 7 格日负荷 */
.tm-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
@media(max-width:360px){.tm-week{gap:4px}.tm-d i{font-size:9px}}   /* v16.13:超窄屏降字号+减间距，防"今·一"撑破 */
.tm-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);
  border-radius:var(--r-2);background:var(--paper2)}
.tm-d i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink4);white-space:nowrap}   /* v16.12:超窄屏不换行 */
.tm-hint{font-size:var(--fs-1)}   /* v16.14:替代内联 style="font-size:11px" */
/* V18:TODAY升级 - 进度环与里程碑样式 */
.tm-extra{display:flex;align-items:center;gap:14px;margin:14px 0 4px;padding:12px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--paper2)}
.tm-ringwrap{position:relative;width:52px;height:52px;flex:none}
.tm-ring{width:52px;height:52px;transform:rotate(-90deg)}
.tm-ring-bg{fill:none;stroke:var(--line);stroke-width:3}
.tm-ring-fg{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round}
.tm-ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.tm-mid{display:flex;flex-direction:column;gap:6px}
.tm-daytag{font-size:12px;color:var(--ink2);font-weight:600}
.tm-ms{font-size:12px;color:var(--ink3)}
.tm-ms b{color:var(--ac);font-family:var(--mono)}
.tm-d b{font-family:var(--mono);font-size:13px;color:var(--ink2);font-weight:600}
.tm-d.on{border-color:var(--ac);background:var(--ac-dim);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.tm-d.on b{color:var(--ac-deep)}
.tm-d.rest b{color:var(--ink4)}
.tm-go{margin-top:14px;background:none;border:1px solid var(--border-default);border-radius:var(--radius-sm);
  padding:9px 16px;font-family:var(--mono);font-size:var(--fs-2);letter-spacing:.06em;color:var(--ink);cursor:pointer;
  transition:border-color var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard)}
.tm-go:hover{border-color:var(--ac);color:var(--ac)}
/* v16:48 周图表当前周高亮 */
.mchart .bar.now{outline:2px solid var(--title);outline-offset:2px;opacity:1}
/* v16:移动端标题收敛——第一屏能看到正文 (§23) */
@media (max-width:640px){
  .chhead{padding-top:calc(var(--top) + 20px);padding-bottom:26px}
  .chhead h2{font-size:clamp(1.5rem,7.2vw,2rem)}
  .chnum{font-size:clamp(3.6rem,26vw,6rem)}
}

/* 打印容器：屏幕隐藏 */
#printall{display:none}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

@media (hover:none){
  .tbtn:hover,.hstat:hover,.tg a:hover,.go:hover,.callout:hover,.card:hover,.stat:hover,
  .quick a:hover,.pace:hover,.chbtn:hover,.po:hover,.chtop:hover,.checkin-fab:hover,.heat .c:hover{
    transform:none!important;box-shadow:none!important}
}

/* ════════════════ 打印（纯 CSS，不依赖 JS 注入） ════════════════ */
@media print{#printall{print-color-adjust:exact;-webkit-print-color-adjust:exact}.vizwrap,.tool{display:none!important} /* 2026-10-04:打印 */
  #printall,#printall *{color:#1a1a1a!important;background-color:transparent!important;border-color:#999!important;}
  #printall th{background:#f2f2f2!important;}
  #printall thead{display:table-header-group;}
  #printall a{color:#1a1a1a!important;text-decoration:none!important;} /* 2026-10-04:打印兜底 */
  .grain,.prog,.topbar,.rail,.drawer,.pal,.mrail,.sbtn,.railbtn,.go,.chbtn,.marks,.cv-track,.cvnum,
  .cover,.spot::before,.chips,input[type=range],.tin,#stage,.vizwrap .vb .mchart,.vizwrap .vb .heat,.checkin-fab,.v18-tools,.v18-modal,.stat-modal{display:none!important}
  *{animation:none!important;transition:none!important;box-shadow:none!important;text-shadow:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  a{color:#000}
  .app{display:block;max-width:none;padding:0}
  #printall{display:block!important}
  #printall section{page-break-before:always}
  #printall section:first-child{page-break-before:auto}
  h1,h2,h3,h4{page-break-after:avoid;color:#000}
  .tblwrap,.card,.callout,.stat,.tool,.lead,.box,.pace,.quick a{page-break-inside:avoid;
    border:1px solid #ddd;background:#fff}
  .tblwrap{overflow:visible}
  .tblwrap table{font-size:9.5pt;min-width:0}
  .tblwrap td:first-child{white-space:normal}   /* v16.10 A6:打印时首列允许换行，避免 44 字单元格溢出纸宽 */
  #printall .quote-box{background:#fff;border-color:#ddd;color:#000}   /* v16.11 P1:深色用户打印时文案块不变成深底；v16.12:去 !important，特异性已够 */
  .chbody{max-width:none}
  @page{margin:18mm 15mm}
}
/* V18:打印稿升级样式（封面/目录/页脚） */
@media print{
  .print-cover{page-break-after:always;display:flex!important;align-items:center;justify-content:center;min-height:90vh;min-height:90dvh;text-align:center}
  .print-cover .pc-inner{max-width:90%}
  .print-cover .pc-kicker{font-family:var(--mono);font-size:11pt;letter-spacing:.3em;color:#666;margin-bottom:18pt}
  .print-cover h1{font-size:28pt;line-height:1.4;margin:0 0 14pt;color:#000}
  .print-cover .pc-sub{font-size:12pt;color:#333;margin-bottom:8pt}
  .print-cover .pc-meta{font-size:10pt;color:#666;margin-bottom:24pt}
  .print-cover .pc-date{font-size:10pt;color:#999}
  .print-notice{border:1px solid #999;padding:12px;margin-bottom:16px;page-break-before:auto}
  .print-notice p{font-size:10pt;color:#555;margin:0}
  .print-toc{page-break-after:always}
  .print-toc h2{font-size:18pt;margin-bottom:14pt}
  .print-toc .ptoc-list{list-style:none;padding:0;margin:0;counter-reset:ptoc}
  .print-toc .ptoc-list li{display:flex;gap:10pt;padding:5pt 0;border-bottom:1px dotted #ccc;font-size:10.5pt}
  .print-toc .ptoc-ch{font-family:var(--mono);white-space:nowrap;color:#333}
  .print-toc .ptoc-ti{flex:1}
  .print-toc .ptoc-note{font-size:9pt;color:#888;margin-top:12pt}

<h3>你的四个真实优势</h3>
<ul>
  <li><strong>体重轻。</strong>173cm/60kg，跑步的经济性天然好。800m 这个项目，体重比绝对力量重要得多。</li>
  <li><strong>年纪小、训练史短。</strong>17 岁前没系统练过，说明你现在的成绩是"原石"，可提升空间比那些从小练到瓶颈的人大得多。</li>
  <li><strong>本地人 + 学校有标准 400m 场 + 操场晚上不清场。</strong>这三条加起来意味着：寒暑假不中断训练，而且你有一个<strong>几乎不受限的夜间训练窗口</strong>。很多跑友最缺的就是这个。</li>
  <li><strong>时间其实比想象中宽裕。</strong>你的四个训练窗口：<strong>每天早上 06:30–07:25</strong>、<strong>周四下午 14:30–18:00</strong>（一周里唯一完整的下午空档）、<strong>周一、周三、周五晚上 19:20–21:00</strong>、<strong>周六日全天</strong>。<strong>完全可以做到一周 6 练</strong>（详见第 07 节"你的真实课表"）。</li>
</ul>

<h3>你的四个真实短板</h3>
<ul>
  <li><strong>停训空窗比预期严重。</strong>现在只能跑 4–5 km 且略累，而高二时 5000m 能跑 20:00。<strong>前 7 周必须非常保守</strong>，别拿高二的记忆当现在的身体用。</li>
  <li><strong>左脚骨折史。</strong>这是最需要认真对待的一条。中长跑对足部和小腿的重复冲击极大，旧骨折部位是应力性损伤的高风险区。<strong>在确认骨愈合良好、左右腿力量对称之前，不要碰跳跃类训练。</strong>详见第 15 节。</li>
  <li><strong>没有教练、也没有校队可进。</strong>学校确实有田径队（教练魏修东等），但那是<strong>体育专业组（丙/丁组）</strong>，普通本科生进不去；学校的「<strong>大学生奔跑协会</strong>」是徒步 + 公益型社团，<strong>不提供中长跑训练</strong>。<strong>意味着训练强度判断、比赛报名、等级申报全部要你自己推</strong>——但这有解，见第 02 节（含"不好意思去问"的破局方案）。</li>

<div class="callout good">
  <span class="lbl">四条理由</span>
  <p><strong>① 1500m 正好补你的短板，而且它比 800m 更"便宜"。</strong>1500m 二级需要 VDOT 65.8，800m 二级需要 VDOT 70.1——<strong>1500m 二级比 800m 二级低了 4.3 个 VDOT 点，是明显更低的门槛。</strong>1500m 训练以跑量和阈值跑为主，有氧堆起来，1500m 会线性上涨，800m 也会跟着涨。<strong>反过来，如果只练 800m，有氧永远补不上，最后大概率卡在 2:03–2:05 好几年。</strong>这是业余中跑选手最常见的瓶颈。</p>
  <p><strong>② 一场比赛报两项，拿两次机会。</strong>重庆市大学生田径比赛通常允许一名选手报两个径赛项目，而 800m 和 1500m 一般不在同一天。<strong>你可以在同一场赛事里冲两条等级线。</strong>这是最实用的战术安排。</p>

  <p><strong>④ 对你转马拉松最顺。</strong>1500m → 5000m → 10000m → 半马 → 全马，是一条连贯的线。从 800m 直接跳路跑，会缺一块有氧地基。</p>

<h4>路径 1 · 抖音私信（难度最低，建议先做这条）</h4>

<h4>路径 2 · 问辅导员 / 班助（最正式、零风险）</h4>
<p>复制这段：</p>
<p class="quote-box">老师，我想问一下：<strong>咱们学校普通本科生想参加重庆市大学生田径比赛的甲组，一般是怎么报名的？是找体育学院还是教务处？</strong></p>
<p style="margin-top:8px"><strong>为什么这条最安全：</strong>辅导员的工作就是回答学生问题。而且他大概率也不知道答案——<strong>他会帮你转给体育学院，这样你就不用直接面对教练了。</strong>这是你最舒服的一条路。</p>

<h4>路径 3 · 体育学院办公室（最直接）</h4>
<p>地点：体育学院（红河校区）。进门就这么说：</p>
<p class="quote-box">老师您好，打扰一下。我是 XX 学院大一的学生，想问一下<strong>普通本科生参加重庆市大学生田径比赛甲组的报名流程</strong>，应该找哪位老师？</p>
<p style="margin-top:8px"><strong class="need">注意：不要一进门就说"我想进田径队"。</strong>那句话会把你放到"申请入队"的语境里，而你要问的是"报名流程"——这是两件事。</p>

<div class="callout warn">

  <p><strong>① 抖音私信：要说，而且要说具体。</strong>不要只说"我是本校的"——说 <strong>"我是 2026 级普通本科生（非体育专业）"</strong>。<br>
  为什么：教练每天收到各种私信。<strong>说清身份，他立刻能判断"这是在校学生，不是外人或推销"</strong>，于是会用"学生事务"的方式回答你。<br>
  <strong>更关键的是：身份说清了，你就不需要证明水平。</strong>你不是在申请入队，你是在问流程——这句话本身就是保护你的。</p>
  <p><strong>② 问辅导员：不用特意说"本校"，但要说清班级。</strong>他本来就带你们年级，是熟人关系。<strong>唯一要补的是"我是 XX 班的"</strong>（如果他不是你们班辅导员）。</p>
  <p><strong>③ 体育学院办公室：必须说，因为你是陌生人敲门。</strong>对方第一反应是"你是谁"。<br>
  进门第一句就是：<strong>"老师您好，我是 XX 学院 2026 级的学生"</strong>——这句让对方把你当学生，而不是当外来人员。</p>
  <p><strong>通用原则：说"具体的身份"，不说"笼统的身份"。</strong>"我是本校的"没有信息量；<strong>"我是 2026 级 XX 学院 XX 专业的本科生"</strong>才是有效身份——它让对方知道你是谁、归谁管、该按什么流程回答你。</p>
  <p class="opt">还有一条：<strong>你就是本校学生，这是事实，也是你的优势。</strong>不用含糊、不用试探——照实说，对方对你的态度只会更好。</p>

<h4>进阶版 · 既问流程，也问"能不能跟训 / 有没有老师带"（这才是你的真实目标）</h4>

<p style="margin-top:8px"><strong>为什么加这段：</strong>报名流程是"你能不能报"，跟训是"你能不能练好、进而被选上"——<strong>两件事都要问，但分开问更自然</strong>：先问流程（不暴露水平），对方回应后再补这段（展示意愿和现有跑量）。</p>

<h3>四条制度细节</h3>

  <p><strong>这意味着"后面转马拉松"这条路拿不到马拉松项目的运动员技术等级称号，只能拿中国田协的"大众选手等级证书"。</strong>这是必须提前知道的制度事实。</p>

</div>

<div class="callout warn">
  <span class="lbl">② 赛事名录制度：不在名录里的比赛，跑了也白跑</span>
  <p>体育总局每年公布《运动员技术等级称号赛事名录》，并明确<strong>原则上不再调整</strong>——<strong>未列入当年名录的全国比赛与省级比赛，不得授予等级称号。</strong></p>
  <p><strong>所以你每年开训前都要先做一件事：查当年的赛事名录，确认目标赛事在册。</strong>别等跑完成绩才发现那场比赛不能评级。</p>
</div>

<div class="callout good">

  <p>等级证书是<strong>电子证书</strong>，由体育总局统一设计编号，在"运动员技术等级系统"公布，<strong>自行下载打印</strong>。<strong>等级称号授予过程中，任何单位和个人不得收取任何费用。</strong></p>
  <p><strong>记住这一条：任何声称"付费代办等级"的都是骗局</strong>，直接拉黑。</p>

<div class="callout danger">

  <p><strong>个人参赛运动员应在比赛结束后 20 日内，主动向中国田协提供已公布且无异议的比赛秩序册与成绩册（PDF 格式），逾期视为放弃。</strong></p>
  <p>换句话说：<strong>比完赛不能等，20 天内要主动去交材料。</strong>这是最容易因为"不知道"而丢掉等级证的一步——把它写进手机提醒。</p>
</div>

<h3>你的现实条件：没有教练，怎么办</h3>

<p>你反馈说：学校只有「大学生奔跑协会」（你当时称"跑步协会"），没有中长跑教练，入队条件也不清楚。这是最需要重新设计的一块。没有教练，意味着四件事都要你自己扛：<strong>训练强度的判断、比赛报名渠道、等级称号申报、伤病的第一道判断</strong>。</p>

<div class="callout warn">
  <span class="lbl">先说结论</span>
  <p>没有教练<strong>不是死局</strong>，但它把"信息差"变成了你最大的敌人。下面六件事按优先级排，前两件这周就能做完，而且价值最高。</p>
</div>

<h3>1500m / 800m 到底是什么项目</h3>
<p>你的主项是 <strong>1500m</strong>，兼项 800m。两个项目的能量系统不一样，这决定了训练比例。</p>
<p><strong>1500m（主项）：约 75–80% 靠有氧供能，20–25% 靠无氧。</strong>这是它比 800m "便宜"的原因——<strong>有氧占比越高，训练越可控、进步越线性、受伤风险越低</strong>。你只要把有氧油箱做大，1500m 成绩几乎会自己往上走，而这正好补你最大的短板。</p>
<p><strong>800m（兼项）：是田径里最"拧巴"的项目</strong>——<strong>约 60–65% 靠有氧供能，35–40% 靠无氧糖酵解</strong>。这意味着：</p>
<ul>
  <li>有氧基础不够，你后 200m 会像撞墙一样掉速；</li>
  <li>但纯练有氧（比如天天慢跑），你又永远跑不出 2:02，因为 800m 的配速（2:32/km）远高于你的有氧阈值；</li>
  <li>真正决定成绩的是<strong>速度耐力</strong>：在乳酸堆积的情况下还能维持配速的能力。</li>
</ul>
<p>所以训练的主线是：<strong>先用大量轻松跑把"有氧油箱"做大（同时服务两个项目）→ 再用间歇课把"高配速耐受度"练出来 → 最后用专项课把两者焊死在比赛配速上。</strong></p>

<h3>四条核心原则</h3>

<div class="card">
<h4 style="margin-top:0">① 80/20 强度分配（Seiler 极化训练）</h4>
<p>每周<strong>约 80% 的跑量应该是"轻松跑"</strong>（能边跑边正常说话），只有约 20% 是高强度。这是耐力训练中被广泛验证的经验法则——注意它是"约数"而非硬指标：基础期、专项期、竞赛期和 taper 周的强度结构本就应该不同。学生最容易犯的错是"每次都跑不快不慢的中等强度"——累得半死，有氧没练到，速度也没练到。</p>
</div>

<div class="card">
<h4 style="margin-top:0">② 周期化：先堆量，再提强度</h4>
<p>一个训练年分成几个阶段，每个阶段只主攻一件事。秋冬堆有氧跑量，春天上强度，赛前减量出状态。<strong>同时追所有能力 = 什么都没追到。</strong></p>
</div>

<div class="card">
<h4 style="margin-top:0">③ 渐进超负荷 + 每 4 周减量</h4>
<p>每周跑量增幅<strong>不超过 10%</strong>，并且<strong>每第 4 周主动减量约 20%</strong>（＝第 05 节的 <strong>×0.8</strong>，例如 48km → 38km）。减量周不是偷懒，是让身体把训练"消化"成能力。跳过减量周，伤病和状态崩盘只是时间问题。</p>
</div>

<div class="card">
<h4 style="margin-top:0">④ 配速分区（丹尼尔斯体系）</h4>
<p>不同的课用完全不同的配速，各练各的能力。下面第 04 节给出你专属的配速表。<strong>别凭感觉跑，凭表跑。</strong></p>
</div>

  <tr><td><strong>训练频次</strong></td><td class="c">每天 2 练，<strong>7 天无完全休息</strong></td><td class="c">每天 1 练，周日休息</td></tr>
  <tr><td><strong>强度标尺</strong></td><td class="c"><strong>每节课全程测血乳酸，实时调配速</strong></td><td class="c">没有乳酸仪</td></tr>
  <tr><td>有氧基础</td><td class="c">10 年以上（12–13 岁起系统训练）</td><td class="c">停训一年，现在能跑 4–5 km</td></tr>
  <tr><td>教练 / 恢复</td><td class="c">专职教练 ＋ 全套恢复保障</td><td class="c">没有教练；宿舍 ＋ 食堂</td></tr>
  </tbody>
  </table>
  </div>
  <p><strong class="need">跑量差约 14 倍。</strong>一句话概括：<strong>挪威双阈值是"给已经跑到 160km/周的人再挤出 3% 提升"的方法。你现在在 12km/周——这两个数字之间隔着 5–8 年。</strong></p>
  <p><strong>而且有一个硬门槛：没有乳酸仪，你根本执行不了它。</strong>这套方法的全部精度都来自"把强度卡在 2.0–3.5 mmol/L"这个窄区间。凭感觉跑"阈值"，绝大多数人会跑到 5–6 mmol/L——<strong>那是 I 配速，不是阈值</strong>。结果：你以为在做双阈值，实际在做两次高强度 → 恢复不了 → 受伤。<br>
  <strong class="need">没有乳酸仪，"双阈值"会退化成"中间强度陷阱"，也就是最糟的那种训练。</strong></p>
  <p class="opt">（便携乳酸仪约 1500–3000 元，试纸 5–8 元/片。<strong>你现在完全不需要买</strong>——第 04 节的 VDOT 配速表 ＋ 说话测试，对你这个阶段已经够用。）</p>
</div>

<div class="callout good">
  <span class="lbl">但它有两条东西你可以直接学 —— 而且第二条是你最需要的</span>
  <p><strong>① 阈值可以"分段做"：总容量相同，恢复更好。</strong><br>
  研究（Talsnes 等 2024）发现：把同样的阈值总容量拆成两段，第二段的心率、血乳酸和 RPE 都更低，次日恢复指标更好。<br>
  → <strong>你手册第 08 节的「巡航间歇（分段型，新手更推荐）」就是这个思路。</strong>周三的节奏跑，如果 20 分钟连着跑太硬，就改成 <code>3×8min @T</code>（中间慢跑 2–3 分钟）——<strong>刺激一样，但更可控。</strong></p>
  <p><strong class="need">② 轻松日必须真的轻松 —— 这是挪威方法里对你最有价值的一句。</strong><br>
  该体系的轻松日要求心率低于最大心率 70%、血乳酸 &lt;2 mmol/L。Bakken 特别强调：<strong>如果轻松日练得太猛，会削弱下一次质量课的质量，整体训练回报反而下降。</strong><br>
  → <strong>这正好是你最容易犯的错（"轻松跑跑太快"）。</strong>把这句话记住：<strong>轻松跑跑快了，不是"多练了"，是"把下一次质量课的质量偷走了"。</strong></p>
  <p><strong>③ 附带一条：阈值训练是 800m–全马所有项目的基础。</strong>即使你主攻 1500m，周三的节奏跑也不能省——这是挪威体系和本手册的共同结论。</p>
  <p class="opt">另：Jakob 的哥哥 <strong>Kristoffer Ingebrigtsen</strong> 是业余跑者，公开分享训练日志，是这套方法的"业余缩放版"。如果你以后想研究，从他入手比从 Jakob 入手有用得多——Jakob 的计划对你没有参考价值。</p>
</div></template>

  <p><strong>两表差多少，看一个例子就清楚：</strong>以你当前水平（5km 21:00 / VDOT 47）为例——本表 T 配速 <strong>4:28/km</strong>，A 表 T 配速 <strong>4:30–4:40/km</strong>，差 <strong>2–12 秒</strong>；E 配速本表 5:22–5:42、A 表 5:25–6:00（A 表的慢端特意放得更宽）。<strong>日常一律按 A 表跑，本表只作换档参考。</strong></p>
  <p><strong>实操原则：</strong>日常按 A/B/C 那三张跑；<strong>这张速查表用来"成绩变了以后快速找到新的一档"</strong>——找到对应的行，然后按同样比例留余量（E 用慢端、T/I/R 各加 5–10 秒）。</p>
  <p><strong>一条底线：日常训练配速（E/T/I/R/M）不要跑得比这张速查表更快。</strong>比标准值快，大概率会让你在几周内受伤——标准值本身就是按"能长期承受"定的，超过它没有额外收益，只有风险。<span class="opt">（专项课的"比赛配速"如 800m 3:02/km 是比赛专项配速，天生比 R 配速快，不在此限——那是比赛，不是日常训练。少数天赋型跑者的 E 配速可能略快于标准值也不出事，但那不适用于复跑期、且你有旧伤——不要拿自己去试这个例外。）</span></p>

<div class="callout">

  <p>另外，<strong>E 跑宁慢勿快</strong>。绝大多数业余跑者的失败原因不是练太少，而是"轻松跑跑太快"。E 跑跑成 M 跑，是最常见的自毁方式。</p>
</div>

<p style="font-size:12.5px;color:var(--txt3)"><strong>中间档位怎么办：</strong>取最接近的一档执行（查询器按最近档位取值，不做逐日插值）；如当天状态不适合，优先向下取整。<br>
<strong>减量周（×0.8）：</strong>按比例把每天减 20%——例如 48 档（5/8/8/6/4/17/0）：5→4、8→6、8→6、6→5、4→3、17→14、0→0，合计 38（目标 38）。<br>
<strong>考试周（×0.8）：</strong>与减量周同系数，同样按比例每天减 20%，<strong>另外把质量课全部砍掉</strong>（这是它比减量周更轻的地方）。<strong>赛后恢复周（W32 = 30km）</strong>按 30 档执行，同样不安排质量课——它不是 ×0.8，是赛后固定恢复量。</p>

  <p>周四下午是你唯一的空档，用来做<strong>力量训练</strong>最合适：力量不需要很长时间，但需要不被打断。周二晚上有课（周四晚上仅 6–9 周有课），早上跑短一点，晚上就不排训练，保证睡眠。</p>

<p style="font-size:12.5px;color:var(--txt3)">每天跑多少公里，查上表对应的档位行。<strong>10 月不安排任何质量课，只跑 E。</strong><strong>D · 竞赛期周六按"E 短"执行</strong>：取表 06-1 周六数字的约 60%（如 48 档周六 17km → 竞赛期跑 10km E），周日固定休息。<strong>赛前降量分两级：赛前 1 周（W30）＝ ×0.67；赛周（W31）＝ ×0.48</strong>（见第 05 节竞赛期说明）。<strong>两级的强度都不减，只是量减</strong>——短而快。</p>

<div class="callout warn">
  <span class="lbl">为什么基础期一周只做一次 T 跑</span>
  <p>基础期（11 月–1 月初）的任务是<strong>堆有氧</strong>，不是练强度。一周两次 T 跑的话，强度占比会到 23–29%，对刚复跑的人偏激进——把大部分训练保持在低强度区间，是本计划控制疲劳的核心原则之一（常说的 80/20 只是一个经验参考，具体强度比例会随阶段和比赛周期变化，不必机械执行）。</p>
  <p>所以：<strong>基础期周三一次 T 就够，周六只在长跑后加短冲刺。</strong>短冲刺的作用是维持跑姿和神经募集；训练量较小，通常不把它视为一次完整的质量课，但它仍有神经肌肉负荷和机械负荷，计入当日和当周总负荷。</p>
  <p>第二次质量课留到<strong>专项期（3 月）</strong>再加，那时跑量已经上到 48km 以上，身体扛得住。</p>
</div>

<div class="callout">
  <span class="lbl">每个阶段的具体做法</span>
  <p><strong>A · 复跑期（10 月）：</strong>全部慢跑，第 1 周每天只跑 2km（6 天 = 12km）。跑完没有疼痛、第二天还想跑，就是这一个月唯一的目标。每周按第 05 节档位走：<strong>12 → 15 → 18 → 14</strong>。</p>
  <p><strong>B · 基础期（11 月–1 月初）：</strong>周三质量课 A 做节奏跑 T，按完整版"热身 2km + 20min @T + 放松 1.5km"执行（总量约 7.5–8.5km）；30km 以下档位可做缩短版"热身 1–1.5km + 10–15min @T + 放松 1km"。T 跑当天的总量以课表结构为准，不受表 06-1 周三数字限制。   <!-- v16.20:用户确认以完整版结构为准 -->周六长跑后加 8×100m 冲刺，配速按第 04 节 A 表。这一阶段从 24 档走到 48 档，<strong>不安排高强度间歇</strong>。</p>
  <p><strong>C · 专项期（3 月–4 月上旬）：</strong>周三质量课 A 改成 I 配速间歇，按"热身 2km + 主课 + 放松 1.5km"结构执行：48–51 档做 4×1000m @I（间歇 2:30），54 档做 6×1000m @I。I 跑当天的总量以课表结构为准，不受表 06-1 周三数字限制。周六质量课 B 做 800m 专项课（如 3×600m @专项配速，间歇 4min）。<strong>如果周六课后跟腱有反应、或前一晚没睡好 → 周日直接改完全休息。</strong></p>
  <p><strong>D · 竞赛期（4 月中–5 月）：</strong>周三改 R 配速质量课，周五加比赛配速课。赛周按 ×0.48 降量（中跑赛前减得更多，见第 05 节），强度不降——赛前 7 天依次是：轻松跑 + 4×200m @专项配速 → 轻松跑 → 2×600m @专项配速 → 轻松跑 + 拉伸 → 轻松跑 + 6×100m 加速 → 轻松跑或完全休息 → 慢跑 15min + 4×60m 加速 → 比赛日（见第 14 节战术，用摸底水平表）。</p>
</div>

<p style="font-size:12.5px;color:var(--txt3)"><strong>周一、周二各有一次 100 分钟体育课（普拉提）</strong>，所以这两天早训各压短一些，减掉的量加到周四下午和周六长跑——<strong>周跑量总数按上面的档位表</strong>。原则：<strong>体育课的负荷要算进去，但它不记在你的跑量里。</strong></p>

<div class="callout good">
  <span class="lbl">留空余时间的设计</span>
  <p>周一、周二、周五都只是短距离轻松跑，加起来强度极低；周四下午只跑步加力量；周末两节课虽然重要，但都在上午，下午和晚上完全空着。</p>
  <p><strong>你每天真正"被占住"的时间不超过 90 分钟。</strong>剩下的时间归你：补作业、打球、打游戏、见朋友、甚至谈恋爱都不冲突。</p>
  <p>如果某周实在忙不过来，按这个顺序砍：<strong>① 砍周二早上的轻松跑 → ② 砍周一早上的轻松跑 → ③ 砍周四力量 → 绝不砍周三晚和周六上午的质量课。</strong>质量课负责提供专项刺激，轻松跑负责建立有氧基础、吸收训练和维持训练连续性；两者缺一不可——砍掉的是"量"，不是"哪类训练不重要"。</p>
</div></template>

<h3>从课表里读出的四个结论</h3>

<div class="callout good">
  <span class="lbl">① 你有四个训练窗口</span>
  <p><strong>窗口一 · 每天早上 06:30–07:25</strong>（第一节 08:10 开始，全周通用）。<br>
  <strong>窗口二 · 周四下午 14:30–18:00</strong>（第五至八节全空，<strong>一周里唯一完整的下午空档</strong>）。<br>
  <strong>窗口三 · 周一、周三、周五晚上 19:20–21:00</strong>（这三个晚上第九、十节都没课）。<br>
  <strong>窗口四 · 周六、周日全天。</strong></p>
  <p><strong>周一、周三、周五的 19:20–21:00 本来就是空的</strong>——质量课不用挤在 18:30，可以从容安排在 19:00。</p>
</div>

<div class="callout warn">
  <span class="lbl">② 周一、周二都有体育课——这两天都算"两次活动日"</span>
  <p><strong>你确认了：体育课一周两次。</strong>周一 1-2 节（08:10–09:50）＋ 周二 7-8 节（16:20–18:00），每次 100 分钟，都在 NB 区知味楼 4 楼体操馆（普拉提）。</p>
  <p>早训 06:30–07:25 排在体育课之前，<strong>练完还有 45 分钟吃饭洗漱</strong>，时间不冲突。</p>
  <p><strong>但周一和周二都变成"两次活动日"</strong>（早上跑 + 体育课）。所以这两天的早训：<strong>只做轻松跑，距离压到 6km，绝不排质量课。</strong></p>
  <p><span class="opt">好消息是：普拉提是低冲击项目，这 200 分钟/周练的是<strong>核心稳定性和髋踝柔韧</strong>——正好补你最容易缺的那块。它不会像篮球那样吃掉你的恢复能力。</span></p>
</div>

<div class="callout warn">
  <span class="lbl">③ 周二最满，别在周二排任何质量课</span>

  <p>所以周二早训<strong>只做轻松跑，距离压到 5–6km</strong>。<strong>周二是一周里最应该"低强度"的一天。</strong></p>
</div>

<h3>夜间训练执行细节（你大量训练在晚上）</h3>
<div class="callout warn">
  <span class="lbl">22:30 前必须收工回寝，否则神经兴奋睡不着</span>
  <p>你的质量课之一在周三 19:00、长跑在周六上午，但<strong>日常有氧很多落在晚上 19:20–21:00 或 21:10 之后</strong>。夜间训练的执行质量，直接决定第二天能不能恢复。几条硬规矩：</p>
  <p><strong>① 下课铃一响就走：</strong>装备（鞋、衣、水、毛巾）提前装包放宿舍门口，别回宿舍再收拾，来回能省 15 分钟。<br>
  <strong>② 结伴夜跑：</strong>操场不关灯不等于安全，尽量和同学一起，穿带反光条的装备。<br>
  <strong>③ 高强度课后不要立刻洗澡躺下：</strong>先拉伸 + 放松走，让心率降到 100 以下再洗，否则 23:30 也睡不着。<br>
  <strong>④ 入睡困难对策：</strong>如果周三夜训质量课（间歇/节奏）连续 3 天导致入睡困难，把最重的课挪到周六上午，夜间只排轻松有氧。</p>
  <p><strong>社团跑不能替代课表：</strong>大学生奔跑协会（建议加入——免费陪练＋校内比赛信息）的活动是社交和健康跑，<strong>不能算作当天质量课</strong>。社团跑了 5km，质量课照做，社团量只当有氧的一部分。同时仍要主动去<strong>体育学院/公共体育部问一句</strong>：有没有中长跑训练队、能不能跟训、有没有老师愿意带——学校没正式田径队不等于没老师愿意指导。</p>
  <p class="opt"><strong>找不到奔跑协会入群入口时，按这条路径找：</strong>① 开学第一周的<strong>社团招新摊位</strong>（操场/食堂门口）；② 问<strong>班长或体育委员</strong>，跑团信息通常从这两个口子流转；③ 关注<strong>体育学院公众号</strong>，或去 NB 区体操馆直接问普拉提老师<strong>钟利</strong>；④ 校运会报名通知（下学期赛前发）出来后，现场也能加到组织群。<strong>先加群、拿到校运会的确切日期，比什么都重要。</strong></p>
</div>

  <p><strong>校田径运动会推迟至下学期</strong>（红河 A 区田径场）。<strong>原定 11 月下旬；2025 年是 11 月 26–28 日，2024 年是 11 月 6 日开幕——日期本就不固定，以下学期的《竞赛规程》为准。</strong>甲组设 800M / 1500M，每人限报 2 个单项，前八名按 10/8/7/5/5/5/5/5 分计入体育成绩，破纪录另有奖金。</p>

<h3>【周末回家特例】周末（你回家，这条专门写）</h3>
<p>周六上午质量课 B，周日上午长跑。<strong>两天都在上午完成，下午和晚上完全自由。</strong>如果想睡懒觉，把训练挪到 10:00–11:30 也完全可以，只要避开正午高温。<span class="opt">（这是"回家防断训"的特例安排；常规周按第 06 节模板，周日为休息/备用恢复日。）</span></p>
<p>你是永川本地人，周末一般回家。<strong>回家最大的风险是"断训"</strong>——周末两天一停，一周的节奏就散了。</p>
<ul>
  <li><strong>周五晚上回家时把跑鞋、跑步袜一起带走。</strong>这是最重要的一条，鞋没带就等于周末报废。</li>
  <li><strong>周六上午质量课 B 可以在家附近跑</strong>，找一段平整的路或公园。找不到合适场地，就回学校跑（如果学校离家不远）。</li>
  <li><strong>周日上午长跑改成"家里那边的路跑"</strong>。路线选择见下面的提醒。</li>
  <li><strong>如果家里确实有事，周日长跑可以压到 6km，但不要跳过。</strong>压缩距离可以，断掉不行——断一次就有第二次。</li>
</ul>

<div class="callout warn">

  <p><strong>优先顺序：</strong>塑胶步道 / 公园土路 &gt; 柏油路 &gt; 水泥路 &gt; 石板路。<br>
  <strong>为什么：</strong>水泥路和石板路的冲击吸收最差，对扁平足和旧骨折部位最不友好。<strong>永川的公园（如城区公园、河堤步道）比人行道好得多。</strong></p>
  <p><strong>三条硬要求：</strong>① 路面平整，别跑台阶和斜坡；② 有路灯，<strong>别在没灯的乡道上跑</strong>；③ 家附近如果有学校操场，优先去操场。</p>
  <p><strong>比例控制：</strong>路跑不超过每周总跑量的 30%。<strong>你一周 6 练里，最多 1–2 次路跑，其余都在塑胶跑道。</strong></p>

  <p><strong>以后怎么用：</strong>当你成绩进步、把第 04 节换成 B 表（大一末现实目标 VDOT 57）时，<strong>本节所有配速数字同步替换成 B 表的对应值</strong>——课的结构、组数、间歇都不变，只有数字变。</p>
</div>

<h3>一、有氧类（占周跑量 75–80%）</h3>
<div class="card tight"><h4 style="margin-top:0">1. 轻松跑 E</h4>
<p>距离见第 06 节（随周跑量增长，基础期约 5–7km）。<strong>这是你 80% 的跑量。</strong></p>
<p><strong class="need">E 跑的优先级顺序（从上到下，上面满足了就不用看下面）：</strong><br>
<strong>① 体感 RPE 2–4 / 10　② 能完整说出一句话　③ 心率趋势平稳　④ 最后才是配速。</strong><br>
所以：今天 5:50/km 觉得特别轻松 → 没问题；今天要 6:15/km 才能轻松 → <strong>6:15 就是对的</strong>；今天 5:30/km 很喘 → <strong>5:30 就是错的，慢下来。</strong><br>
<code>5:25–6:00/km</code> 只是"参考值"，不是"必须值"。<strong>把轻松跑跑成中等强度，是业余跑者第一大坑。</strong></p></div>

<div class="card tight"><h4 style="margin-top:0">2. 长跑</h4>
<p>距离见第 06 节的周分解总表（基础期 4–8km，随周跑量增长到专项期的 8–11km），配速 <code>5:35–6:15/km</code>。周末上午做。从第 8 周起，可以尝试"<strong>快结束</strong>"——最后 2–3km 提到 M 配速（<code>4:50–5:00/km</code>）。</p></div>

<div class="card tight"><h4 style="margin-top:0">3. 法特莱克（变速跑）</h4>
<p>在轻松跑中插入不规律加速：<code>1min 快 / 1min 慢 × 15–20 组</code>。快段配速约 T 配速。适合天气不好、心情烦躁时跑，有趣且有效。</p></div>

<div class="card tight"><h4 style="margin-top:0">4. 坡跑</h4>
<p>找一段 100–200m 的缓坡：<code>8–10 × 上坡跑</code>，用力但不失控；慢跑下坡恢复。<strong>坡跑是"免费的力量课"</strong>，永川周边丘陵地形很适合。注意：下坡慢跑，别冲，保护膝盖。</p>
<p style="font-size:12.5px"><span class="need">⚠️ 别直接照抄这一课，先看引入条件。</span>上坡对跟腱和胫后肌腱的负荷高于平地，而你有跟腱弹响和扁平足。<strong>寒假与开学过渡（1 月）要安排坡跑，必须先满足第 05 节阶段 2 的门槛</strong>（10–12 月全程无左脚/左踝/跟腱不适 + 单腿提踵左右次数一致）；不满足就整体推迟到 3 月专项准备期，这期间用室内单车或椭圆机替代。首次做从<strong>缓坡、每周 1 次、总量 ≤2km</strong> 起步。</p></div>

<h3>二、阈值类（每周 1 次）</h3>
<div class="card tight"><h4 style="margin-top:0">5. 节奏跑（持续型）</h4>
<p>热身 2km → <code>20–30 分钟 @T 配速（4:30–4:40/km）</code> → 放松 3km。感觉是"舒适地难受"，能说 3–5 个字的短句。</p></div>

<div class="card tight"><h4 style="margin-top:0">6. 巡航间歇（分段型，新手更推荐）</h4>
<p>热身 2km → <code>3 × 8 分钟 @T 配速（约 3×1750m），间歇慢跑 2–3 分钟</code> → 放松 3km。<strong>比持续型更容易控制，也更容易坚持。</strong>适合从 11 月开始。如果觉得吃力，先从 <code>3 × 6 分钟</code> 起步。</p></div>

<h3>三、最大摄氧量类（春季主攻，每周 1 次）</h3>
<div class="card tight"><h4 style="margin-top:0">7. 1000m 间歇</h4>
<p>热身 3km → <code>6 × 1000m @I 配速（4:05–4:15/km）</code>，每组之间慢跑 400m（约 2:30–3:00）恢复 → 放松 3km。<strong>这是提升成绩最有效的一节课。</strong></p></div>

<div class="card tight"><h4 style="margin-top:0">8. 1200m 间歇</h4>
<p><code>5 × 1200m @I 配速</code>，间歇慢跑 3 分钟。适合 1500m 专项。<strong>间歇跑的关键是：每组配速要稳，不要第一组冲太快。</strong></p></div>

<div class="card tight"><h4 style="margin-top:0">9. 金字塔间歇</h4>
<p><code>400m – 600m – 800m – 1000m – 800m – 600m – 400m</code>，全部 @I 配速，间歇 2:30–3:00。趣味性强，适合专项期。</p></div>

<h3>四、速度耐力类（800m 胜负手，每周 1–2 次）</h3>
<div class="card tight"><h4 style="margin-top:0">10. 600m 专项重复</h4>
<p>热身 3km → <code>3–4 × 600m @比 800m 比赛配速慢 2–3 秒/400m</code>，间歇完全恢复 4–6 分钟 → 放松 3km。<br>
以第 17 节的大一末现实目标 800m 约 2:26（VDOT 57）为例：800m 配速 = 72.9s/400m。<br>所以 600m 专项跑 <code>1:52–1:54</code>（比<strong>大一末目标配速</strong>每 400m 慢 2–3 秒，即 75–76s/400m × 1.5）。<br>
<span class="opt">间歇必须充分：心率降到 120 左右再开始下一组，否则练的是"抗疲劳"而不是"配速"。</span></p></div>

<div class="card tight"><h4 style="margin-top:0">11. 300m 速度耐力</h4>
<p><code>2 组 × (4 × 300m @接近 800m 比赛配速)</code>，组内间歇 1:30，组间 5 分钟。以 2:26 目标为例，300m 跑 <code>54–55 秒</code>。</p></div>

<div class="card tight"><h4 style="margin-top:0">12. 阶梯跑（长距离版）</h4>
<p><code>400 – 600 – 800 – 600 – 400</code>，全部 @800m 比赛配速。这是最接近实战的课，建议赛前 3–4 周做 1–2 次。</p></div>

<div class="card tight"><h4 style="margin-top:0">13. 分段配速模拟（关键课）</h4>
<p>完全按比赛分段跑：<code>200m @比赛配速 + 400m @比赛配速 + 200m @更快</code>，中间不休息。<br>
例：2:02 目标 = 200m 30s → 400m 61s → 200m 31s，总 2:02。这课让你<strong>身体记住比赛的节奏</strong>。</p></div>

<h3>五、速度 / 跑姿类（每周 1–2 次，跑后做）</h3>
<div class="card tight"><h4 style="margin-top:0">14. 短冲刺（strides）</h4>
<p>轻松跑结束后：<code>6–8 × 100m</code>，加速到接近全速（约 90%），然后走 100m 恢复。<strong>目的是练跑姿和神经募集，不是练累。</strong>做完应该感觉神清气爽。</p></div>

<div class="card tight"><h4 style="margin-top:0">15. 200m 重复跑</h4>
<p><code>8–10 × 200m @R 配速（3:45–3:55/km，即 45–47 秒）</code>，走 200m 恢复。速度感训练。</p></div>

<div class="card tight"><h4 style="margin-top:0">16. 跑姿练习（drills）</h4>
<p>每次轻松跑前做，每个动作 2×30m：<br>
小步跑 · 高抬腿 · 后踢腿 · 跨步跳 · 直腿跑 · 单腿跳。<br>
<span class="opt">网上搜"跑步技术练习 drills"有大量视频。这套动作每天 8 分钟，半年后跑姿会有明显变化。</span></p></div>

<div class="callout danger">
  <span class="lbl">两条关于跑姿的警告</span>
  <p><strong>① 绝对不要去改"脚跟着地 → 前脚掌着地"。</strong>网上和 AI 都爱给这条建议，理由是"减少膝盖压力"。<strong>但对你，这条是反的：</strong>前脚掌着地会把负荷从膝盖转移到<strong>小腿三头肌和跟腱</strong>——而你身上唯一的活跃信号，就是<strong>跟腱弹响</strong>。改着地方式不会让你变快，只会让跟腱先出问题。</p>
  <p>你要做的不是"改成前掌"，而是<strong>提高步频</strong>：把步频从估计的 165–170 提到 <strong>175–180 步/分</strong>。同一配速下步频提高，步幅自然变小、落地点更靠近重心，膝盖和跟腱的峰值负荷同时下降。<strong>这是唯一一条对你既安全又有效的跑姿调整。</strong>做法：手机装个节拍器 App，轻松跑时跟着 178 的节拍跑，每周 2–3 次，8 周形成习惯。</p>
  <p><strong>② 上面那套跑姿练习里的"跨步跳、单腿跳"，前 7 周先划掉。</strong>第 15 节定了"前 7 周禁一切跳跃类"，这两项就是跳跃。10.05–11.22 只做<strong>小步跑、高抬腿、后踢腿、直腿跑</strong>这四项（原地或短距技术动作，没有落地冲击）；<strong>跨步跳和单腿跳等 11.22 之后确认左脚全程无痛再加回来。</strong></p>
</div>

<div class="card tight"><h4 style="margin-top:0">17. 跳绳</h4>
<p>雨天替代方案，或作为协调性训练。<code>3 组 × 3 分钟</code>，组间休息 1 分钟。也可做双摇（练爆发力）。</p></div>

<h3>六、恢复类</h3>
<div class="card tight"><h4 style="margin-top:0">18. 恢复跑</h4>
<p>比 E 跑更慢：<code>6:00–6:30/km</code>，距离 3–6km。<strong>在质量课后的第二天做</strong>，目的是促进血液循环、加速恢复，而不是训练。</p></div>

<div class="card tight"><h4 style="margin-top:0">19. 交叉训练（雨天/伤后）</h4>
<p>游泳、骑车、椭圆机、爬楼梯：30–60 分钟，心率保持在 E 区间。能在不增加关节冲击的前提下维持有氧能力。</p></div>

<div class="callout">
  <span class="lbl">每次训练的固定流程</span>
  <p><strong>热身（10–15 分钟）</strong>：慢跑 2–3km + 动态拉伸（摆腿、弓步走、髋绕环）+ 跑姿练习<br>
  <strong>主课</strong>：按计划执行<br>
  <strong>放松（5–10 分钟）</strong>：慢跑或走路降心率 + 静态拉伸（小腿、腘绳肌、股四头、髋屈肌、髂胫束）<br>
  <strong>质量课后</strong>：泡沫轴放松 10 分钟</p>
</div></template>
<template data-ch="09" data-title="力量与核心训练"><div class="callout warn">
  <span class="lbl">决定：健身房先不办，一个月后复查</span>
  <p>把力量课做成<strong>杠铃版</strong>（深蹲 4×5 @80% 1RM、罗马尼亚硬拉 3×6）对 800m/1500m 这种速度耐力项目是有效的——<strong>最大力量不是辅助项</strong>，而"只跑不练力量"是普通生卡在 2:10 左右的常见原因。</p>
  <p><strong>但你的决定是"先跑一个月再说"，我同意，理由有三条：</strong><br>  ① 大一前半年本来就是<strong>堆有氧为主</strong>，力量课的边际收益在第三个月之后才明显；<br>  ② 健身房在<strong>校外</strong>，多一个通勤环节就多一个放弃理由——<strong>先把跑步这件事稳住更重要</strong>；<br>  ③ 你现在连"一周 6 练"都还没跑过，先证明自己能坚持，再谈加码。</p>
  <p><strong>复查时间点：11 月中（第 7 周）。</strong>到时候看两件事：① 能稳定完成当前周的加量周跑量吗（原版看 30km，保守版看 24km）；② 自重力量课有没有觉得太轻。<strong>两条都满足，就去问一下周边健身房一学期多少钱，再决定要不要升级杠铃版。</strong></p>
</div>


<p>中跑选手的力量训练不是为了练大块肌肉，而是为了：<strong>① 提高跑步经济性；② 预防伤病；③ 提升冲刺阶段的爆发力。</strong>每周 1–2 次，每次 30–40 分钟，放在轻松跑之后。</p>

<div class="callout good">
  <span class="lbl">学校没健身房，完全不影响</span>
  <p>你反馈学校没有健身房、只有周边有（校外）。好消息是：<strong>中跑需要的力量，80% 用自重加一条弹力带就能练到。</strong>需要杠铃的主要是"最大力量"部分，而对你现在这个阶段（先堆有氧、先不受伤）来说，自重的性价比反而更高——而且不会因为"要跑去健身房"而多出一个放弃的理由。</p>
  <p>下面的方案<strong>零器械、宿舍可做</strong>。等你真的需要上杠铃深蹲时（那要到大二之后），再考虑校外健身房。</p>
</div>

<h3>力量 A · 宿舍自重版（秋冬用，每周 1 次）</h3>

<div class="grid2">
<div class="card">
<h4 style="margin-top:0">下肢与后链</h4>
<ul style="margin-left:18px">
<li>单腿箱式深蹲（坐椅子上再站起）<code>3×10/腿</code></li>
<li>保加利亚分腿蹲（后脚搭床沿）<code>3×10/腿</code></li>
<li>单腿罗马尼亚硬拉（自重，慢下）<code>3×10/腿</code></li>
<li>单腿臀桥 <code>3×12/腿</code></li>
<li>靠墙静蹲 <code>3×45 秒</code></li>
<li>单腿提踵（台阶边缘）<code>3×15/腿</code></li>
</ul>
<p style="font-size:12.5px;color:var(--txt3)">中跑最需要的是<strong>单腿力量和稳定性</strong>，所以上面几乎全是单侧动作。这也是为什么不需要大重量。</p>
</div>
<div class="card">
<h4 style="margin-top:0">核心与上肢</h4>

<li>平板支撑 <code>3×60 秒</code></li>
<li>侧平板 <code>3×30 秒/侧</code></li>
<li>死虫式 <code>3×12</code></li>
<li>鸟狗式 <code>3×10/侧</code></li>
<li>俯卧撑 <code>3×12</code></li>
<li>弹力带划船 <code>3×15</code></li>

</ul>
<p style="font-size:12.5px;color:var(--txt3)">组间休息 60–90 秒。重点是动作标准、单侧稳定，不是次数。每周 1 次就够，练多了影响跑步恢复。</p>

</div>

<div class="callout good">
  <span class="lbl">如果时间紧：只做这 5 个动作（20 分钟版）</span>
  <p>下面两阶段是完整版。<strong>如果你只有 20 分钟，做这 5 个就够</strong>——它们全部来自第一阶段（无跳跃）：</p>
  <p><strong>① 保加利亚分腿蹲</strong> 3×10/腿（单侧力量与稳定性）<br>
  <strong>② 单腿罗马尼亚硬拉</strong> 3×10/腿（后链 ＋ 平衡）<br>

<h3>力量 B · 分两阶段：先"练稳"，再"练爆发"</h3>
<p><strong>你左脚有骨折史、跟腱偶有弹响、轻微扁平足。所以力量训练不能直接上跳跃，必须分两步走。</strong></p>

<div class="card">
<h4 style="margin-top:0">第一阶段 · 踝足与单侧稳定（10 月起就能做，长期保留）</h4>

<li>单腿提踵（慢速，3 秒下） <code>3×15/腿</code></li>
<li>屈膝提踵 <code>3×15/腿</code></li>
<li>胫骨前肌训练（靠墙勾脚 / 弹力带勾脚） <code>3×20</code></li>
<li>足内在肌（毛巾抓握、短足运动） <code>3×15</code></li>
<li>单腿罗马尼亚硬拉 <code>3×10/腿</code></li>
<li>分腿蹲 <code>3×10/腿</code></li>
<li>臀中肌（侧卧抬腿、蚌式、弹力带侧走） <code>3×15</code></li>
<li>核心（死虫、平板、侧平板） <code>3 组</code></li>
</ul>
<p style="font-size:12.5px;color:var(--txt3)">这一阶段<strong>没有跳跃、没有落地冲击</strong>，是给踝关节和单侧稳定性打地基。<strong>每周 2 次，一直做下去</strong>——不要因为"觉得太轻"就跳过，它比跳跃更能保护你的左脚。</p>
</div>

<div class="card">
<h4 style="margin-top:0">第二阶段 · 爆发力（满足条件后才进，每周 1 次）</h4>
<ul style="margin-left:18px">
<li>跳绳双摇 <code>3×30 秒</code>（<strong>最先引入</strong>，因为落地高度最低）</li>
<li>台阶跳（操场看台，单脚落地） <code>4×8</code></li>
<li>深蹲跳 <code>4×5</code></li>
<li>原地单腿跳 <code>3×8/腿</code></li>
<li>弹力带加速跑 <code>6×20m</code></li>
<li>快速提踵 <code>4×20</code></li>
</ul>
<p style="font-size:12.5px;color:var(--txt3)">爆发力训练<strong>必须在充分热身后做</strong>，且放在跑量之前。疲劳状态下做跳跃 = 受伤。<strong>引入顺序从上到下，一次只加一项，每项先做 2 周。</strong></p>
<p style="font-size:12.5px;color:var(--red2);font-weight:700;margin-top:8px">⚠️ 进入第二阶段的四个条件（缺一不可——"提踵差 ≤3 次"远远不够）：<br>
